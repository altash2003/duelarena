<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STICK N' DUEL</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0d0d10; --p1: #ff4757; --p2: #2e86de; --acc: #feca57; --text: #fff; }
        * { box-sizing: border-box; }
        
        body {
            background-color: var(--bg); color: var(--text);
            font-family: 'Press Start 2P', cursive;
            margin: 0; height: 100vh; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle, #222 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* --- COMPACT CONSOLE LAYOUT --- */
        .console-wrapper {
            width: 900px; height: 600px;
            background: #111;
            border: 4px solid #444;
            box-shadow: 0 0 50px #000;
            display: flex; flex-direction: column;
            position: relative;
        }

        /* HEADER */
        .header {
            height: 50px; background: #222; border-bottom: 2px solid #000;
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
        }
        .logo { color: var(--acc); font-size: 14px; text-shadow: 2px 2px #000; }
        .credit-pill { font-size: 8px; background: #000; padding: 8px; border: 1px solid #444; }

        /* TABS */
        .tabs { display: flex; background: #1a1a1a; border-bottom: 2px solid #000; }
        .tab { flex: 1; text-align: center; padding: 10px; font-size: 8px; color: #666; cursor: pointer; border-right: 1px solid #000; }
        .tab:hover { background: #333; }
        .tab.active { background: #333; color: var(--acc); border-bottom: 2px solid var(--acc); }

        /* MAIN STAGE (P1 | GAME | P2) */
        .stage-grid {
            display: grid; grid-template-columns: 200px 1fr 200px;
            height: 250px; border-bottom: 4px solid #000;
        }
        
        /* PLAYER PANELS */
        .p-panel { background: #151515; display: flex; flex-direction: column; align-items: center; border-right: 2px solid #000; position: relative; }
        .p-panel:last-child { border-right: none; border-left: 2px solid #000; }
        .p1.active { background: rgba(255, 71, 87, 0.1); box-shadow: inset 0 0 20px rgba(255, 71, 87, 0.2); }
        .p2.active { background: rgba(46, 134, 222, 0.1); box-shadow: inset 0 0 20px rgba(46, 134, 222, 0.2); }

        .p-head { width: 100%; text-align: center; padding: 10px; font-size: 8px; background: #000; color: #888; }
        .p1 .p-head { color: var(--p1); } .p2 .p-head { color: var(--p2); }
        
        .p-score { font-size: 40px; font-family: 'Rajdhani'; margin-top: 20px; }
        .p-btn { margin-top: auto; margin-bottom: 20px; width: 80%; padding: 10px; border: 2px solid #fff; background: #222; color: #fff; font-family: inherit; font-size: 8px; cursor: pointer; }
        .p-btn:hover { background: #444; }

        /* CENTER GAME */
        .center-game { background: #000; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .game-status { text-align: center; padding: 5px; font-size: 8px; color: #aaa; background: #111; }
        .visuals { flex-grow: 1; display: flex; justify-content: center; align-items: center; }

        /* DASHBOARD (BOTTOM) */
        .dashboard { flex-grow: 1; display: flex; }
        
        /* BETTING */
        .dash-col { flex: 1; border-right: 2px solid #000; display: flex; flex-direction: column; background: #111; }
        .dash-head { padding: 8px; font-size: 8px; background: #222; border-bottom: 2px solid #000; color: #888; }
        
        .bet-grid { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .bet-row { display: flex; gap: 5px; }
        .b-btn { flex: 1; padding: 10px; background: #222; border: 1px solid #444; color: #555; cursor: pointer; font-family: inherit; font-size: 8px; }
        .b-btn.sel { border-color: #fff; color: #fff; }
        .inp { width: 100%; background: #000; border: 1px solid #444; color: #fff; padding: 10px; font-family: inherit; font-size: 8px; text-align: center; }
        .place-btn { background: #f39c12; color: #000; border: 2px solid #000; padding: 10px; cursor: pointer; font-family: inherit; font-size: 10px; }
        .place-btn:disabled { background: #444; color: #666; cursor: not-allowed; }

        /* PLAYERS & CHAT */
        .p-list { flex: 1; overflow-y: auto; padding: 5px; font-size: 8px; }
        .p-row { display: flex; justify-content: space-between; padding: 5px; border-bottom: 1px solid #222; }
        
        .chat-log { flex: 1; overflow-y: auto; padding: 5px; font-family: 'Rajdhani'; font-size: 12px; line-height: 1.4; color: #aaa; }
        .chat-msg { margin-bottom: 2px; }

        /* MODALS */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; border: 2px solid #fff; padding: 25px; z-index: 2000; text-align: center; width: 320px; box-shadow: 0 0 0 100vw rgba(0,0,0,0.8); display: none; }
        .active { display: block; }
        .m-title { color: var(--acc); font-size: 16px; margin-bottom: 5px; }
        .m-sub { font-size: 8px; color: #ff4757; margin-bottom: 15px; }
        
        /* ASSETS */
        .die { width: 40px; height: 40px; background: #fff; border-radius: 4px; display: grid; grid-template-columns: repeat(3, 1fr); padding: 2px; box-shadow: 2px 2px 0 #000; }
        .dot { background: #000; border-radius: 50%; visibility: hidden; }
        .die[v="1"] .dot:nth-child(5){visibility:visible} .die[v="2"] .dot:nth-child(1),.die[v="2"] .dot:nth-child(9){visibility:visible} .die[v="3"] .dot:nth-child(1),.die[v="3"] .dot:nth-child(5),.die[v="3"] .dot:nth-child(9){visibility:visible} .die[v="4"] .dot:nth-child(1),.die[v="4"] .dot:nth-child(3),.die[v="4"] .dot:nth-child(7),.die[v="4"] .dot:nth-child(9){visibility:visible} .die[v="5"] .dot:nth-child(1),.die[v="5"] .dot:nth-child(3),.die[v="5"] .dot:nth-child(5),.die[v="5"] .dot:nth-child(7),.die[v="5"] .dot:nth-child(9){visibility:visible} .die[v="6"] .dot:nth-child(1),.die[v="6"] .dot:nth-child(3),.die[v="6"] .dot:nth-child(4),.die[v="6"] .dot:nth-child(6),.die[v="6"] .dot:nth-child(7),.die[v="6"] .dot:nth-child(9){visibility:visible}
        .coin { width: 60px; height: 60px; border-radius: 50%; background: var(--acc); border: 4px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #000; font-weight: bold; }
        .shaking { animation: shake 0.2s infinite; }
        @keyframes shake { 0% { transform: rotate(0deg); } 25% { transform: rotate(10deg); } 75% { transform: rotate(-10deg); } 100% { transform: rotate(0deg); } }
    </style>
</head>
<body>

    <div class="modal active" id="authModal">
        <div class="m-title">STICK N' DUEL</div>
        <div class="m-sub">Database Connection Error. Check Server Logs.</div>
        <input id="uInput" class="inp" placeholder="USERNAME" style="margin-bottom:10px;">
        <input id="pInput" type="password" class="inp" placeholder="PASSWORD" style="margin-bottom:15px;">
        <button class="place-btn" onclick="auth()" style="width:100%;">LOGIN / SIGNUP</button>
    </div>

    <div class="modal" id="ticketModal">
        <div class="m-title">SUPPORT TICKET</div>
        <textarea id="ticMsg" class="inp" style="height:80px; margin-bottom:10px;" placeholder="DESCRIBE ISSUE"></textarea>
        <button class="place-btn" onclick="sendTicket()" style="width:100%;">SEND</button>
        <div style="font-size:8px; cursor:pointer; margin-top:10px;" onclick="document.getElementById('ticketModal').classList.remove('active')">CLOSE</div>
    </div>

    <div class="modal" id="propModal">
        <div class="m-title">HOST MATCH</div>
        <div style="text-align:left; font-size:8px; color:#aaa; margin-bottom:5px;">GAME</div>
        <select id="sGame" class="inp" style="margin-bottom:10px;"><option value="dice">DICE</option><option value="coin">COIN</option><option value="rps">RPS</option></select>
        <div style="text-align:left; font-size:8px; color:#aaa; margin-bottom:5px;">ROUNDS</div>
        <select id="sRound" class="inp" style="margin-bottom:10px;"><option value="1|SUDDEN DEATH">1 ROUND</option><option value="3|BEST OF 3">BEST OF 3</option></select>
        <div style="text-align:left; font-size:8px; color:#aaa; margin-bottom:5px;">WAGER</div>
        <input id="sWager" class="inp" value="0" type="number" style="margin-bottom:15px;">
        <button class="place-btn" onclick="subProp()" style="width:100%; background:var(--acc);">PROPOSE</button>
    </div>

    <div class="modal" id="accModal">
        <div class="m-title">CHALLENGE!</div>
        <div id="propTxt" style="font-size:10px; color:#aaa; margin-bottom:20px;"></div>
        <button class="place-btn" onclick="resp(true)" style="width:100%; margin-bottom:5px; background:#2ecc71;">ACCEPT</button>
        <button class="place-btn" onclick="resp(false)" style="width:100%; background:#ff4757;">DECLINE</button>
    </div>

    <div class="modal" id="winModal" style="background:#000; border:none; z-index:3000;">
        <div style="color:var(--acc); font-size:12px; margin-bottom:20px;">MATCH COMPLETE!</div>
        <div id="winTxt" style="font-size:40px; margin-bottom:30px;">P1 WINS</div>
        <button class="place-btn" onclick="document.getElementById('winModal').classList.remove('active')" style="width:100%; background:#fff;">CONTINUE</button>
    </div>

    <div class="console-wrapper">
        <div class="header">
            <div class="logo">CASINO DUEL - LIVE</div>
            <div class="credit-pill" id="myBal">WALLET: 0 TC</div>
        </div>

        <div class="tabs">
            <div class="tab" id="t-dice">DICE</div>
            <div class="tab" id="t-coin">COIN</div>
            <div class="tab" id="t-rps">RPS</div>
            <div class="tab" id="t-ttt">TTT</div>
        </div>

        <div class="stage-grid">
            <div class="p-panel p1" id="p1Panel">
                <div class="p-head">PLAYER 1</div>
                <div class="p-score" id="p1Score">0</div>
                <button id="p1Btn" class="p-btn" onclick="reqSeat(1)">SIT</button>
            </div>

            <div class="center-game">
                <div class="game-status" id="status">WAITING FOR PLAYERS...</div>
                <div class="visuals" id="vis">VS</div>
            </div>

            <div class="p-panel p2" id="p2Panel">
                <div class="p-head">PLAYER 2</div>
                <div class="p-score" id="p2Score">0</div>
                <button id="p2Btn" class="p-btn" onclick="reqSeat(2)">SIT</button>
            </div>
        </div>

        <div class="dashboard">
            <div class="dash-col" style="flex:1;">
                <div class="dash-head">BETTING</div>
                <div class="bet-grid">
                    <div class="bet-row">
                        <button class="b-btn" id="b1" onclick="selB(1)">P1</button>
                        <button class="b-btn" id="b2" onclick="selB(2)">P2</button>
                    </div>
                    <input id="betAmt" class="inp" placeholder="AMOUNT">
                    <button id="plBet" class="place-btn" onclick="plBet()">PLACE BET</button>
                    <div style="font-size:6px; color:#555; text-align:center;">ODDS: 2.0x</div>
                </div>
            </div>

            <div class="dash-col" style="flex:1;">
                <div class="dash-head">ONLINE</div>
                <div class="p-list" id="pList"></div>
                <button class="b-btn" style="border:none; border-top:1px solid #333;" onclick="document.getElementById('ticketModal').classList.add('active')">SUPPORT TICKET</button>
            </div>

            <div class="dash-col" style="flex:1.5; border-right:none;">
                <div class="dash-head">CHAT</div>
                <div class="chat-log" id="cLog"></div>
                <input class="inp" style="border:none; border-top:1px solid #333;" placeholder="Type..." onkeypress="sChat(event)">
            </div>
        </div>
    </div>

<script>
    const socket = io();
    let me=null, state={}, bTarg=null;

    // AUTH
    function auth(){ const u=document.getElementById('uInput').value, p=document.getElementById('pInput').value; if(u&&p) socket.emit('auth',{username:u,password:p}); }
    socket.on('auth_success', d=>{ me=d.username; document.getElementById('authModal').classList.remove('active'); updBal(d.balance); });
    socket.on('auth_fail', m=>alert(m));
    socket.on('balance_update', b=>updBal(b));
    function updBal(b){ document.getElementById('myBal').innerText=`WALLET: ${b} TC`; }

    // TICKET
    function sendTicket(){ const m=document.getElementById('ticMsg').value; if(m) socket.emit('wallet_action',{type:'ticket', msg:m}); document.getElementById('ticketModal').classList.remove('active'); }
    socket.on('alert', m=>alert(m));

    // LOBBY
    function reqSeat(n){ socket.emit('request_seat',n); }
    socket.on('prompt_proposal', ()=>document.getElementById('propModal').classList.add('active'));
    
    function subProp(){
        const r = document.getElementById('sRound').value.split('|');
        socket.emit('propose_terms', { game:document.getElementById('sGame').value, targetScore:r[0], roundLabel:r[1], wager:document.getElementById('sWager').value });
        document.getElementById('propModal').classList.remove('active');
    }
    
    socket.on('review_terms', t=>{
        document.getElementById('accModal').classList.add('active');
        document.getElementById('propTxt').innerText = `${t.game.toUpperCase()} | ${t.roundLabel} | ${t.wager} TC`;
    });
    function resp(ok){ socket.emit('respond_terms', ok); document.getElementById('accModal').classList.remove('active'); }

    // GAME UI
    socket.on('state_update', s=>{ state=s; render(); });
    socket.on('game_reset', g=>{
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        document.getElementById(`t-${g}`).classList.add('active');
    });

    function render(){
        document.getElementById('status').innerText = state.statusText || "WAITING";
        document.getElementById('p1Score').innerText = state.scores[1];
        document.getElementById('p2Score').innerText = state.scores[2];
        
        // Panels
        document.getElementById('p1Panel').className = `p-panel p1 ${state.matchActive && state.turn===1?'active':''}`;
        document.getElementById('p2Panel').className = `p-panel p2 ${state.matchActive && state.turn===2?'active':''}`;

        btnState(1); btnState(2);
        
        // Betting
        document.getElementById('plBet').disabled = state.bettingLocked || !state.negotiating;
    }

    function btnState(n){
        const user = state.seats[n];
        const btn = document.getElementById(`p${n}Btn`);
        if(user === me){
            if(state.matchActive && state.turn === n) btn.innerText = "PLAY"; 
            else if(state.matchActive) btn.innerText = "WAIT";
            else btn.innerText = "LEAVE";
            btn.onclick = () => {
                if(state.matchActive && state.turn === n) socket.emit('game_action', {action:'roll'}); 
                else if(!state.matchActive) socket.emit('leave_seat');
            };
        } else if(user) { btn.innerText = user; btn.onclick = null; }
        else { btn.innerText = "SIT"; btn.onclick = () => reqSeat(n); }
    }

    // VISUALS
    socket.on('anim_dice', d => {
        document.getElementById('vis').innerHTML = `<div style="display:flex; gap:10px;">${d.roll.map(v=>`<div class="die" v="${v}"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`).join('')}</div>`;
    });
    socket.on('match_over', d => {
        const m = document.getElementById('winModal'); m.classList.add('active');
        document.getElementById('winTxt').innerText = `P${d.winner} WINS!`;
    });

    // CHAT & LIST
    socket.on('player_joined', d => document.getElementById('pList').innerHTML += `<div class="p-row"><div>${d.username}</div></div>`);
    function sChat(e){ if(e.key==='Enter'){ socket.emit('chat_msg', e.target.value); e.target.value=''; }}
    socket.on('chat_msg', d => {
        const l = document.getElementById('cLog');
        l.innerHTML += `<div class="chat-msg"><span style="color:${d.color}">${d.user}:</span> ${d.text}</div>`;
        l.scrollTop = l.scrollHeight;
    });

    // BETTING
    function selB(n){ bTarg=n; document.getElementById('b1').classList.toggle('sel', n===1); document.getElementById('b2').classList.toggle('sel', n===2); }
    function plBet(){ const v=document.getElementById('betAmt').value; if(v && bTarg) socket.emit('place_bet', {amount:v, target:bTarg}); }

</script>
</body>
</html>
