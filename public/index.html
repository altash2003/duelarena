<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUEL ARENA - LIVE</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #121216; --bg-panel: #1e1e24; --p1: #ff4757; --p2: #2e86de; --accent: #feca57; --text: #fff; }
        * { box-sizing: border-box; }
        body { background: var(--bg-dark); color: var(--text); font-family: 'Press Start 2P', cursive; margin: 0; height: 100vh; display: flex; overflow: hidden; }
        
        .main-layout { display: flex; width: 100%; height: 100%; padding: 20px; gap: 20px; }
        .game-area { flex: 1; display: flex; flex-direction: column; gap: 20px; position: relative; }
        
        /* --- TOP BAR --- */
        .top-bar { display: flex; justify-content: space-between; border-bottom: 4px solid #333; padding-bottom: 10px; }
        .match-info { font-size: 10px; color: #aaa; display: flex; gap: 15px; }
        .match-info span { color: var(--accent); }

        /* --- ARENA --- */
        .arena { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; height: 100%; }
        
        .player-panel { 
            background: var(--bg-panel); border: 4px solid #333; 
            display: flex; flex-direction: column; align-items: center; 
            transition: all 0.3s; position: relative;
        }
        
        /* TURN INDICATOR - GLOW */
        .player-panel.active-turn { 
            border-color: #2ecc71; 
            box-shadow: 0 0 25px rgba(46, 204, 113, 0.3); 
            transform: scale(1.02); z-index: 10;
        }

        .p-name { background: #000; color: #fff; width: 100%; text-align: center; padding: 10px; font-size: 12px; }
        .score { font-size: 50px; font-family: 'Rajdhani'; margin: 20px 0; }
        .controls { width: 100%; padding: 10px; margin-top: auto; }

        .center-stage { border: 4px solid #333; background: #000; position: relative; display: flex; align-items: center; justify-content: center; }
        .visuals { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

        /* --- SETTINGS PROPOSAL MODAL (Inside Game Area) --- */
        #settingsPanel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #1e1e24; border: 4px solid var(--accent); padding: 20px;
            width: 300px; text-align: center; z-index: 100; display: none;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        .set-row { margin-bottom: 15px; text-align: left; }
        .set-label { font-size: 10px; color: #aaa; margin-bottom: 5px; display: block; }
        select, input { width: 100%; padding: 10px; background: #000; border: 2px solid #555; color: #fff; font-family: 'Press Start 2P'; font-size: 10px; }
        
        /* --- BUTTONS --- */
        .btn { width: 100%; padding: 15px; background: #333; color: #fff; border: 2px solid #000; cursor: pointer; font-family: 'Press Start 2P'; margin-top: 5px; font-size: 10px; }
        .btn:hover { background: #444; }
        .btn-green { background: #2ecc71; color: #000; }
        .btn-red { background: #ff4757; }

        /* --- ASSETS (Dice/Coin) --- */
        .die { width: 60px; height: 60px; background: #fff; border: 4px solid #000; border-radius: 8px; display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; box-shadow: 4px 4px 0 rgba(0,0,0,0.5); margin: 5px; }
        .dot { background: #000; width: 12px; height: 12px; border-radius: 50%; margin: auto; visibility: hidden; }
        .die[v="1"] .dot:nth-child(5){visibility:visible} .die[v="2"] .dot:nth-child(1),.die[v="2"] .dot:nth-child(9){visibility:visible} .die[v="3"] .dot:nth-child(1),.die[v="3"] .dot:nth-child(5),.die[v="3"] .dot:nth-child(9){visibility:visible} .die[v="4"] .dot:nth-child(1),.die[v="4"] .dot:nth-child(3),.die[v="4"] .dot:nth-child(7),.die[v="4"] .dot:nth-child(9){visibility:visible} .die[v="5"] .dot:nth-child(1),.die[v="5"] .dot:nth-child(3),.die[v="5"] .dot:nth-child(5),.die[v="5"] .dot:nth-child(7),.die[v="5"] .dot:nth-child(9){visibility:visible} .die[v="6"] .dot:nth-child(1),.die[v="6"] .dot:nth-child(3),.die[v="6"] .dot:nth-child(4),.die[v="6"] .dot:nth-child(6),.die[v="6"] .dot:nth-child(7),.die[v="6"] .dot:nth-child(9){visibility:visible}
        .coin { width: 100px; height: 100px; border-radius: 50%; background: #feca57; border: 5px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #000; font-weight: bold; }

        /* AUTH MODAL */
        #authOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:999; display:flex; align-items:center; justify-content:center; }
        .auth-box { background:#1e1e24; border:4px solid var(--accent); padding:30px; text-align:center; }
    </style>
</head>
<body>

    <div id="authOverlay">
        <div class="auth-box">
            <h1 style="color:var(--accent);">DUEL ARENA</h1>
            <input id="uInput" placeholder="USERNAME" style="margin-bottom:10px;"><br>
            <input id="pInput" type="password" placeholder="PASSWORD" style="margin-bottom:10px;"><br>
            <button class="btn btn-green" onclick="auth()">ENTER</button>
        </div>
    </div>

    <div class="main-layout">
        <div class="game-area">
            
            <div class="top-bar">
                <div style="color:var(--accent);">DUEL ARENA</div>
                <div class="match-info">
                    GAME: <span id="gameTypeDisp">DICE</span> | 
                    MODE: <span id="roundDisp">WAITING</span> | 
                    WAGER: <span id="wagerDisp">0</span>
                </div>
            </div>

            <div id="settingsPanel">
                <h3 style="color:var(--accent); margin-top:0;">MATCH SETTINGS</h3>
                
                <div class="set-row">
                    <label class="set-label">GAME TYPE</label>
                    <select id="setGame">
                        <option value="dice">DICE DUEL</option>
                        <option value="coin">COIN FLIP</option>
                    </select>
                </div>

                <div class="set-row">
                    <label class="set-label">VICTORY CONDITION</label>
                    <select id="setRounds">
                        <option value="1">1 ROUND (SUDDEN DEATH)</option>
                        <option value="2">BEST OF 3 (FIRST TO 2)</option>
                        <option value="3">BEST OF 5 (FIRST TO 3)</option>
                        <option value="3">RACE TO 3</option>
                        <option value="5">RACE TO 5</option>
                    </select>
                </div>

                <div class="set-row">
                    <label class="set-label">WAGER (TC)</label>
                    <input type="number" id="setWager" value="0" min="0">
                </div>

                <button class="btn btn-green" onclick="submitSettings()">SET TERMS</button>
                <div style="font-size:8px; color:#666; margin-top:10px;">P2 will accept these terms by sitting.</div>
            </div>

            <div class="arena">
                <div class="player-panel" id="p1Panel">
                    <div class="p-name" id="p1Name">EMPTY</div>
                    <div class="score" id="p1Score">0</div>
                    <div class="controls" id="p1Controls">
                        <button class="btn" onclick="reqSeat(1)">TAKE SEAT</button>
                    </div>
                </div>

                <div class="center-stage">
                    <div class="visuals" id="visuals">
                        <div style="color:#333; font-size:20px;">VS</div>
                    </div>
                </div>

                <div class="player-panel" id="p2Panel">
                    <div class="p-name" id="p2Name">EMPTY</div>
                    <div class="score" id="p2Score">0</div>
                    <div class="controls" id="p2Controls">
                        <button class="btn" onclick="reqSeat(2)">TAKE SEAT</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

<script>
    const socket = io();
    let me = null;
    let state = {};

    function auth() {
        const u = document.getElementById('uInput').value;
        const p = document.getElementById('pInput').value;
        if(u && p) socket.emit('auth', { username: u, password: p });
    }

    socket.on('auth_success', (data) => {
        me = data.username;
        document.getElementById('authOverlay').style.display = 'none';
    });

    // --- MAIN STATE HANDLER ---
    socket.on('update_state', (s) => {
        state = s;
        renderUI();
    });

    socket.on('anim_dice', (data) => {
        const v = document.getElementById('visuals');
        v.innerHTML = `<div style="display:flex; gap:10px;">${getDie(data.roll[0])}${getDie(data.roll[1])}${getDie(data.roll[2])}</div>`;
        document.getElementById('p1Panel').classList.remove('active-turn');
        document.getElementById('p2Panel').classList.remove('active-turn');
    });

    socket.on('anim_coin', (data) => {
        const v = document.getElementById('visuals');
        v.innerHTML = `<div class="coin">${data.result}</div>`;
    });

    socket.on('match_over', (data) => {
        alert(`${data.name} WINS THE MATCH!`);
    });

    socket.on('error_msg', (msg) => alert(msg));

    function renderUI() {
        // Update Info Bar
        document.getElementById('gameTypeDisp').innerText = state.settings.game.toUpperCase();
        document.getElementById('wagerDisp').innerText = state.settings.wager;
        
        let modeTxt = "CUSTOM";
        if(state.settings.targetScore == 1) modeTxt = "SUDDEN DEATH";
        else if(state.settings.targetScore == 2) modeTxt = "BEST OF 3";
        else if(state.settings.targetScore == 3) modeTxt = "BEST OF 5 / RACE TO 3";
        else if(state.settings.targetScore == 5) modeTxt = "RACE TO 5";
        document.getElementById('roundDisp').innerText = modeTxt;

        // Scores
        document.getElementById('p1Score').innerText = state.scores[1];
        document.getElementById('p2Score').innerText = state.scores[2];

        // Players & Seats
        updateSeat(1);
        updateSeat(2);

        // Turn Indicator (Only if match active)
        const p1p = document.getElementById('p1Panel');
        const p2p = document.getElementById('p2Panel');
        p1p.classList.remove('active-turn');
        p2p.classList.remove('active-turn');

        if(state.matchActive) {
            if(state.turn === 1) p1p.classList.add('active-turn');
            if(state.turn === 2) p2p.classList.add('active-turn');
        }

        // Proposal Panel Visibility
        // Show if I am P1, I am sitting, Match is NOT active, and P2 is NOT sitting
        if(state.seats[1] === me && !state.matchActive && !state.seats[2]) {
            document.getElementById('settingsPanel').style.display = 'block';
        } else {
            document.getElementById('settingsPanel').style.display = 'none';
        }
    }

    function updateSeat(n) {
        const nameDiv = document.getElementById(`p${n}Name`);
        const ctrlDiv = document.getElementById(`p${n}Controls`);
        const player = state.seats[n];

        nameDiv.innerText = player || "EMPTY";
        
        // Button Logic
        if(player === me) {
            // I am in this seat
            if(state.matchActive) {
                ctrlDiv.innerHTML = `<div style="font-size:10px; color:#aaa;">LOCKED</div>`;
                // Add Gameplay buttons if my turn
                if(state.turn === n) {
                    if(state.settings.game === 'dice') {
                        ctrlDiv.innerHTML += `<button class="btn btn-green" onclick="act('roll')">ROLL DICE</button>`;
                    } else if(state.settings.game === 'coin') {
                        ctrlDiv.innerHTML += `<button class="btn btn-green" onclick="actC('H')">HEADS</button><button class="btn btn-green" onclick="actC('T')">TAILS</button>`;
                    }
                }
            } else {
                ctrlDiv.innerHTML = `<button class="btn btn-red" onclick="leave()">LEAVE</button>`;
            }
        } else if (!player) {
            // Seat is empty
            ctrlDiv.innerHTML = `<button class="btn" onclick="reqSeat(${n})">TAKE SEAT</button>`;
        } else {
            // Someone else is here
            ctrlDiv.innerHTML = `<div style="font-size:10px; color:#666;">OCCUPIED</div>`;
        }
    }

    // ACTIONS
    function reqSeat(n) { socket.emit('request_seat', n); }
    function leave() { socket.emit('leave_seat'); }
    
    function submitSettings() {
        const game = document.getElementById('setGame').value;
        const rounds = document.getElementById('setRounds').value;
        const wager = document.getElementById('setWager').value;
        socket.emit('update_settings', { game, targetScore: rounds, wager });
    }

    function act(action) { socket.emit('game_action', { action }); }
    function actC(guess) { socket.emit('game_action', { guess }); }

    function getDie(val) {
        return `<div class="die" v="${val}"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    }

</script>
</body>
</html>
