<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUEL ARENA - ULTIMATE</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #121216; --bg-panel: #1e1e24; --accent: #feca57; --text: #fff; }
        * { box-sizing: border-box; }
        body { background: var(--bg-dark); color: var(--text); font-family: 'Press Start 2P', cursive; margin: 0; height: 100vh; display: flex; overflow: hidden; }
        
        .main-layout { display: flex; width: 100%; height: 100%; padding: 20px; gap: 20px; }
        .game-area { flex: 1; display: flex; flex-direction: column; gap: 20px; position: relative; }
        
        .top-bar { display: flex; justify-content: space-between; border-bottom: 4px solid #333; padding-bottom: 10px; }
        .arena { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; height: 100%; }
        
        .player-panel { background: var(--bg-panel); border: 4px solid #333; display: flex; flex-direction: column; align-items: center; transition: all 0.3s; }
        .player-panel.active-turn { border-color: #2ecc71; box-shadow: 0 0 25px rgba(46, 204, 113, 0.3); z-index: 10; }
        
        .p-name { background: #000; width: 100%; text-align: center; padding: 10px; font-size: 12px; }
        .score { font-size: 50px; font-family: 'Rajdhani'; margin: 20px 0; }
        .controls { width: 100%; padding: 10px; margin-top: auto; display: flex; flex-direction: column; gap: 5px; }

        .center-stage { border: 4px solid #333; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
        .visuals { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

        /* MODALS */
        #settingsPanel, #authOverlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e1e24; border: 4px solid var(--accent); padding: 20px; text-align: center; z-index: 100; }
        #authOverlay { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.95); }
        .set-row { margin-bottom: 15px; text-align: left; }
        select, input { width: 100%; padding: 10px; background: #000; border: 2px solid #555; color: #fff; font-family: 'Press Start 2P'; font-size: 10px; }
        .btn { width: 100%; padding: 15px; background: #333; color: #fff; border: 2px solid #000; cursor: pointer; font-family: 'Press Start 2P'; font-size: 10px; }
        .btn:hover { background: #444; } .btn-green { background: #2ecc71; color: #000; }

        /* ASSETS */
        .die { width: 60px; height: 60px; background: #fff; border: 4px solid #000; border-radius: 8px; display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; box-shadow: 4px 4px 0 rgba(0,0,0,0.5); margin: 5px; }
        .dot { background: #000; width: 12px; height: 12px; border-radius: 50%; margin: auto; visibility: hidden; }
        .die[v="1"] .dot:nth-child(5){visibility:visible} .die[v="2"] .dot:nth-child(1),.die[v="2"] .dot:nth-child(9){visibility:visible} .die[v="3"] .dot:nth-child(1),.die[v="3"] .dot:nth-child(5),.die[v="3"] .dot:nth-child(9){visibility:visible} .die[v="4"] .dot:nth-child(1),.die[v="4"] .dot:nth-child(3),.die[v="4"] .dot:nth-child(7),.die[v="4"] .dot:nth-child(9){visibility:visible} .die[v="5"] .dot:nth-child(1),.die[v="5"] .dot:nth-child(3),.die[v="5"] .dot:nth-child(5),.die[v="5"] .dot:nth-child(7),.die[v="5"] .dot:nth-child(9){visibility:visible} .die[v="6"] .dot:nth-child(1),.die[v="6"] .dot:nth-child(3),.die[v="6"] .dot:nth-child(4),.die[v="6"] .dot:nth-child(6),.die[v="6"] .dot:nth-child(7),.die[v="6"] .dot:nth-child(9){visibility:visible}
        
        .coin { width: 100px; height: 100px; border-radius: 50%; background: #feca57; border: 5px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #000; font-weight: bold; }
        
        .hl-card { width: 100px; height: 150px; background: #fff; border-radius: 10px; border: 4px solid #000; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #000; }
        
        .wheel { width: 150px; height: 150px; border-radius: 50%; background: conic-gradient(red 0deg 180deg, black 180deg 360deg); border: 4px solid #fff; transition: transform 2s ease-out; }
        .wheel-marker { position: absolute; top: -10px; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 20px solid #feca57; z-index: 5; }

        .ttt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .ttt-cell { width: 50px; height: 50px; background: #222; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; border: 1px solid #444; }
        .ttt-cell:hover { background: #333; }
    </style>
</head>
<body>

    <div id="authOverlay"><div class="auth-box"><h1 style="color:var(--accent);">DUEL ARENA</h1><input id="uInput" placeholder="USERNAME" style="margin-bottom:10px;"><br><input id="pInput" type="password" placeholder="PASSWORD" style="margin-bottom:10px;"><br><button class="btn btn-green" onclick="auth()">ENTER</button></div></div>

    <div class="main-layout">
        <div class="game-area">
            <div class="top-bar">
                <div style="color:var(--accent);">DUEL ARENA</div>
                <div style="font-size:10px; color:#aaa;">GAME: <span id="gameTypeDisp">LOADING</span> | TARGET: <span id="roundDisp">1</span></div>
            </div>

            <div id="settingsPanel" style="display:none;">
                <h3 style="color:var(--accent);">MATCH SETUP</h3>
                <div class="set-row">
                    <label>GAME</label>
                    <select id="setGame">
                        <option value="dice">DICE DUEL</option>
                        <option value="coin">COIN FLIP</option>
                        <option value="hl">HIGH-LOW</option>
                        <option value="roulette">ROULETTE</option>
                        <option value="rps">ROCK PAPER SCISSORS</option>
                        <option value="ttt">TIC TAC TOE</option>
                    </select>
                </div>
                <div class="set-row"><label>ROUNDS</label><select id="setRounds"><option value="1">1 ROUND (SUDDEN DEATH)</option><option value="3">BEST OF 5</option></select></div>
                <div class="set-row"><label>WAGER</label><input type="number" id="setWager" value="0"></div>
                <button class="btn btn-green" onclick="submitSettings()">PROPOSE TERMS</button>
            </div>

            <div class="arena">
                <div class="player-panel" id="p1Panel">
                    <div class="p-name" id="p1Name">EMPTY</div>
                    <div class="score" id="p1Score">0</div>
                    <div class="controls" id="p1Controls"><button class="btn" onclick="reqSeat(1)">TAKE SEAT</button></div>
                </div>

                <div class="center-stage">
                    <div class="visuals" id="visuals"><div style="color:#333; font-size:20px;">VS</div></div>
                </div>

                <div class="player-panel" id="p2Panel">
                    <div class="p-name" id="p2Name">EMPTY</div>
                    <div class="score" id="p2Score">0</div>
                    <div class="controls" id="p2Controls"><button class="btn" onclick="reqSeat(2)">TAKE SEAT</button></div>
                </div>
            </div>
        </div>
    </div>

<script>
    const socket = io();
    let me = null;
    let state = {};

    function auth() {
        const u = document.getElementById('uInput').value;
        const p = document.getElementById('pInput').value;
        if(u && p) socket.emit('auth', { username: u, password: p });
    }
    socket.on('auth_success', (data) => { me = data.username; document.getElementById('authOverlay').style.display = 'none'; });

    socket.on('state_update', (s) => {
        state = s;
        renderUI();
    });

    // --- ANIMATIONS ---
    socket.on('anim_dice', (d) => {
        setVis(`<div style="display:flex; gap:10px;">${getDie(d.roll[0])}${getDie(d.roll[1])}${getDie(d.roll[2])}</div>`);
    });
    socket.on('anim_coin', (d) => setVis(`<div class="coin">${d.result}</div>`));
    socket.on('anim_hl', (d) => setVis(`<div style="display:flex; gap:20px;"><div class="hl-card">${d.current}</div><div>-></div><div class="hl-card" style="border-color:#feca57">${d.next}</div></div>`));
    socket.on('anim_roulette', (d) => setVis(`<div style="position:relative"><div class="wheel-marker" style="left:50%; transform:translateX(-50%)"></div><div class="wheel" style="transform:rotate(${d.angle}deg)"></div></div>`));
    socket.on('rps_lock', (d) => {
        // Show indicator that player locked
        document.getElementById(`p${d.seat}Panel`).style.backgroundColor = '#feca57';
    });
    socket.on('rps_reveal', (d) => {
        setVis(`<div style="font-size:40px;">P1:${d.p1}  VS  P2:${d.p2}</div>`);
        document.getElementById('p1Panel').style.backgroundColor = '';
        document.getElementById('p2Panel').style.backgroundColor = '';
    });
    socket.on('anim_ttt', (d) => {
        let h = `<div class="ttt-grid">`;
        d.board.forEach((c, i) => {
            h += `<div class="ttt-cell" onclick="act('ttt', ${i})">${c || ''}</div>`;
        });
        h += `</div>`;
        setVis(h);
    });

    socket.on('match_over', (d) => alert(`${d.name} WINS!`));
    socket.on('error_msg', (m) => alert(m));

    function setVis(h) { document.getElementById('visuals').innerHTML = h; }

    function renderUI() {
        document.getElementById('gameTypeDisp').innerText = state.settings.game.toUpperCase();
        document.getElementById('roundDisp').innerText = state.settings.targetScore;
        document.getElementById('p1Score').innerText = state.scores[1];
        document.getElementById('p2Score').innerText = state.scores[2];
        
        updateSeat(1); updateSeat(2);

        // Turn Indicators
        document.getElementById('p1Panel').classList.remove('active-turn');
        document.getElementById('p2Panel').classList.remove('active-turn');
        if(state.matchActive && state.settings.game !== 'rps') {
            document.getElementById(`p${state.turn}Panel`).classList.add('active-turn');
        }

        // Settings Modal
        const showSettings = (state.seats[1] === me && !state.matchActive && !state.seats[2]);
        document.getElementById('settingsPanel').style.display = showSettings ? 'block' : 'none';

        // TTT Board persist
        if(state.settings.game === 'ttt' && state.matchActive) {
            let h = `<div class="ttt-grid">`;
            state.temp.tttBoard.forEach((c, i) => {
                h += `<div class="ttt-cell" onclick="act('ttt', ${i})">${c || ''}</div>`;
            });
            h += `</div>`;
            setVis(h);
        }
    }

    function updateSeat(n) {
        const div = document.getElementById(`p${n}Controls`);
        const player = state.seats[n];
        document.getElementById(`p${n}Name`).innerText = player || "EMPTY";

        if (player === me) {
            if (state.matchActive) {
                div.innerHTML = `<div style="font-size:10px; color:#aaa;">LOCKED</div>`;
                // If My Turn (or RPS), show controls
                if (state.turn === n || state.settings.game === 'rps') {
                    const G = state.settings.game;
                    if (G === 'dice') div.innerHTML += `<button class="btn btn-green" onclick="act('roll')">ROLL</button>`;
                    if (G === 'coin') div.innerHTML += `<button class="btn btn-green" onclick="actC('H')">HEADS</button><button class="btn btn-green" onclick="actC('T')">TAILS</button>`;
                    if (G === 'hl') div.innerHTML += `<button class="btn btn-green" onclick="actC('high')">HIGHER</button><button class="btn btn-green" onclick="actC('low')">LOWER</button>`;
                    if (G === 'roulette') div.innerHTML += `<button class="btn btn-green" onclick="actC('RED')">RED</button><button class="btn btn-green" onclick="actC('BLACK')">BLACK</button>`;
                    if (G === 'rps') div.innerHTML += `<button class="btn" onclick="actC('R')">ROCK</button><button class="btn" onclick="actC('P')">PAPER</button><button class="btn" onclick="actC('S')">SCISSOR</button>`;
                    if (G === 'ttt') div.innerHTML += `<div style="font-size:10px;">TAP GRID</div>`;
                }
            } else {
                div.innerHTML = `<button class="btn" style="background:#ff4757" onclick="leave()">LEAVE</button>`;
            }
        } else if (!player) {
            div.innerHTML = `<button class="btn" onclick="reqSeat(${n})">SIT</button>`;
        } else {
            div.innerHTML = `<div style="font-size:10px; color:#666;">OCCUPIED</div>`;
        }
    }

    function reqSeat(n) { socket.emit('request_seat', n); }
    function leave() { socket.emit('leave_seat'); }
    function submitSettings() {
        const game = document.getElementById('setGame').value;
        const rounds = document.getElementById('setRounds').value;
        const wager = document.getElementById('setWager').value;
        socket.emit('update_settings', { game, targetScore: rounds, wager });
    }
    
    function act(action, index) { socket.emit('game_action', { action, index }); }
    function actC(guess) { socket.emit('game_action', { guess }); }

    function getDie(v) { return `<div class="die" v="${v}"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`; }
</script>
</body>
</html>
