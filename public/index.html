<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASINO DUEL ARENA</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #121216; --bg-panel: #1e1e24; --accent: #feca57; --text: #fff; --p1: #ff4757; --p2: #2e86de; }
        * { box-sizing: border-box; }
        body { background-color: var(--bg-dark); color: var(--text); font-family: 'Press Start 2P', cursive; margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; }
        
        /* LAYOUT */
        .main-wrapper { display: flex; width: 100%; height: 100%; padding: 20px; gap: 20px; }
        .game-section { flex: 1; display: flex; flex-direction: column; }
        .social-sidebar { width: 320px; display: flex; flex-direction: column; gap: 15px; }

        /* UI ELEMENTS */
        .top-bar { display: flex; justify-content: space-between; border-bottom: 4px solid #333; padding-bottom: 10px; margin-bottom: 10px; align-items: center; }
        .info-txt { font-size: 10px; color: #aaa; } .info-txt span { color: var(--accent); }
        
        .arena { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 20px; flex-grow: 1; }
        .player-panel { background: var(--bg-panel); border: 4px solid #333; display: flex; flex-direction: column; align-items: center; transition: 0.3s; }
        .player-panel.active-turn { border-color: #2ecc71; box-shadow: 0 0 20px rgba(46,204,113,0.3); }
        
        .p-name { background: #000; width: 100%; text-align: center; padding: 10px; font-size: 10px; }
        .score { font-size: 50px; font-family: 'Rajdhani'; margin: auto; }
        .controls { width: 100%; padding: 10px; display: flex; flex-direction: column; gap: 5px; }

        .center-stage { background: #000; border: 4px solid #333; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .visuals { width: 100%; display: flex; justify-content: center; align-items: center; flex-grow: 1; }
        .status-bar { width: 100%; text-align: center; background: #222; padding: 5px; font-size: 10px; color: #aaa; }

        /* SIDEBAR PANELS */
        .panel { background: var(--bg-panel); border: 4px solid #000; display: flex; flex-direction: column; overflow: hidden; }
        .panel-head { background: #2f3640; padding: 10px; font-size: 10px; border-bottom: 4px solid #000; }
        
        .chat-box { flex-grow: 1; }
        .chat-log { flex-grow: 1; overflow-y: auto; padding: 10px; font-family: 'Rajdhani'; font-size: 14px; color: #ccc; }
        .chat-input { background: #000; border: none; border-top: 4px solid #333; color: #fff; padding: 15px; width: 100%; font-family: 'Press Start 2P'; font-size: 10px; outline: none; }

        /* BETTING */
        .bet-area { padding: 15px; background: #191919; }
        .wallet { text-align: center; color: var(--accent); margin-bottom: 10px; font-size: 10px; }
        .input-std { width: 100%; background: #000; border: 2px solid #555; color: #fff; padding: 10px; font-family: 'Press Start 2P'; font-size: 10px; margin-bottom: 5px; }
        
        /* MODALS */
        #authOverlay, #settingsPanel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e1e24; border: 4px solid var(--accent); padding: 20px; z-index: 100; text-align: center; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        #authOverlay { width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; }

        /* BUTTONS & ASSETS */
        .btn { width: 100%; padding: 15px; background: #333; color: #fff; border: 2px solid #000; cursor: pointer; font-family: 'Press Start 2P'; font-size: 10px; }
        .btn:hover { background: #444; } .btn-green { background: #2ecc71; color: #000; } .btn-red { background: #ff4757; }
        
        .die { width: 60px; height: 60px; background: #fff; border: 3px solid #000; border-radius: 5px; display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; box-shadow: 4px 4px 0 #000; }
        .dot { background: #000; width: 12px; height: 12px; border-radius: 50%; margin: auto; visibility: hidden; }
        .die[v="1"] .dot:nth-child(5){visibility:visible} .die[v="2"] .dot:nth-child(1),.die[v="2"] .dot:nth-child(9){visibility:visible} .die[v="3"] .dot:nth-child(1),.die[v="3"] .dot:nth-child(5),.die[v="3"] .dot:nth-child(9){visibility:visible} .die[v="4"] .dot:nth-child(1),.die[v="4"] .dot:nth-child(3),.die[v="4"] .dot:nth-child(7),.die[v="4"] .dot:nth-child(9){visibility:visible} .die[v="5"] .dot:nth-child(1),.die[v="5"] .dot:nth-child(3),.die[v="5"] .dot:nth-child(5),.die[v="5"] .dot:nth-child(7),.die[v="5"] .dot:nth-child(9){visibility:visible} .die[v="6"] .dot:nth-child(1),.die[v="6"] .dot:nth-child(3),.die[v="6"] .dot:nth-child(4),.die[v="6"] .dot:nth-child(6),.die[v="6"] .dot:nth-child(7),.die[v="6"] .dot:nth-child(9){visibility:visible}
        .coin { width: 80px; height: 80px; border-radius: 50%; background: #feca57; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #000; font-weight: bold; }
        .hl-card { width: 80px; height: 120px; background: #fff; border: 4px solid #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #000; }
        .wheel { width: 120px; height: 120px; border-radius: 50%; background: conic-gradient(red 0deg 180deg, black 180deg 360deg); border: 4px solid #fff; transition: transform 2s ease-out; }
        .wheel-marker { position: absolute; top: -10px; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 20px solid var(--accent); z-index: 5; }
        .ttt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .ttt-cell { width: 40px; height: 40px; background: #222; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 1px solid #444; cursor: pointer; }
    </style>
</head>
<body>

    <div id="authOverlay"><div class="panel" style="padding:40px; text-align:center;"><h1 style="color:var(--accent);">DUEL ARENA</h1><input id="uInput" class="input-std" placeholder="USERNAME"><input id="pInput" type="password" class="input-std" placeholder="PASSWORD"><button class="btn btn-green" onclick="auth()">ENTER WORLD</button></div></div>

    <div id="settingsPanel" style="display:none;">
        <h3 style="color:var(--accent);">MATCH TERMS</h3>
        <div style="text-align:left; margin-bottom:10px;">GAME<br><select id="setGame" class="input-std"><option value="dice">DICE</option><option value="coin">COIN</option><option value="hl">HI-LO</option><option value="roulette">ROULETTE</option><option value="rps">RPS</option><option value="ttt">TIC TAC TOE</option></select></div>
        <div style="text-align:left; margin-bottom:10px;">ROUNDS<br><select id="setRounds" class="input-std"><option value="1">1 (SUDDEN DEATH)</option><option value="3">3 (BEST OF 5)</option><option value="5">5 (RACE TO 5)</option></select></div>
        <div style="text-align:left; margin-bottom:10px;">WAGER<br><input type="number" id="setWager" class="input-std" value="0"></div>
        <button class="btn btn-green" onclick="submitSettings()">PROPOSE TERMS</button>
    </div>

    <div class="main-wrapper">
        <div class="game-section">
            <div class="top-bar">
                <h2 style="margin:0; color:var(--accent);">ARENA</h2>
                <div class="info-txt">GAME: <span id="gDisp">...</span> | GOAL: <span id="rDisp">...</span> | WAGER: <span id="wDisp">0</span></div>
            </div>

            <div class="arena">
                <div class="player-panel" id="p1Panel">
                    <div class="p-name" id="p1Name">EMPTY</div>
                    <div class="score" id="p1Score">0</div>
                    <div class="controls" id="p1Controls"><button class="btn" onclick="reqSeat(1)">SIT P1</button></div>
                </div>

                <div class="center-stage">
                    <div class="status-bar" id="status">WAITING FOR PLAYERS...</div>
                    <div class="visuals" id="visuals"><div style="color:#333; font-size:20px;">VS</div></div>
                </div>

                <div class="player-panel" id="p2Panel">
                    <div class="p-name" id="p2Name">EMPTY</div>
                    <div class="score" id="p2Score">0</div>
                    <div class="controls" id="p2Controls"><button class="btn" onclick="reqSeat(2)">SIT P2</button></div>
                </div>
            </div>
        </div>

        <div class="social-sidebar">
            <div class="panel bet-area">
                <div class="wallet" id="walletDisplay">WALLET: ...</div>
                <div style="font-size:8px; color:#666; text-align:center; margin-bottom:5px;">SPECTATOR BET</div>
                <input class="input-std" placeholder="AMOUNT" id="betAmt">
                <div style="display:flex; gap:5px;">
                    <button class="btn" style="background:var(--p1); font-size:8px;" onclick="placeBet(1)">BET P1</button>
                    <button class="btn" style="background:var(--p2); font-size:8px;" onclick="placeBet(2)">BET P2</button>
                </div>
            </div>

            <div class="panel chat-box">
                <div class="panel-head">LIVE CHAT</div>
                <div class="chat-log custom-scroll" id="chatLog"></div>
                <input class="chat-input" placeholder="Type here..." onkeypress="sendChat(event)">
            </div>
        </div>
    </div>

<script>
    const socket = io();
    let me = null;
    let state = {};

    function auth() {
        const u = document.getElementById('uInput').value;
        const p = document.getElementById('pInput').value;
        if(u && p) socket.emit('auth', { username: u, password: p });
    }
    socket.on('auth_success', (d) => { me = d.username; document.getElementById('authOverlay').style.display = 'none'; updateWallet(d.balance); });
    socket.on('balance_update', (bal) => updateWallet(bal));
    function updateWallet(b) { document.getElementById('walletDisplay').innerText = `WALLET: ${b} TC`; }

    // BETTING
    function placeBet(target) {
        const amt = parseInt(document.getElementById('betAmt').value);
        if(amt > 0) socket.emit('place_bet', { amount: amt, target });
    }

    // CHAT
    function sendChat(e) { if(e.key === 'Enter' && e.target.value) { socket.emit('chat_msg', e.target.value); e.target.value = ''; } }
    socket.on('chat_msg', (d) => {
        const log = document.getElementById('chatLog');
        log.innerHTML += `<div style="margin-bottom:5px;"><span style="color:${d.color}">${d.user}:</span> <span style="color:#ccc">${d.text}</span></div>`;
        log.scrollTop = log.scrollHeight;
        if(d.user === 'SYSTEM' || d.user === 'REF') document.getElementById('status').innerText = d.text;
    });

    socket.on('state_update', (s) => { state = s; renderUI(); });
    
    // VISUALS
    socket.on('anim_dice', (d) => vis(`<div style="display:flex; gap:10px;">${getDie(d.roll[0])}${getDie(d.roll[1])}${getDie(d.roll[2])}</div>`));
    socket.on('anim_coin', (d) => vis(`<div class="coin">${d.result}</div>`));
    socket.on('anim_hl', (d) => vis(`<div style="display:flex; gap:20px;"><div class="hl-card">${d.current}</div><div style="color:#fff; font-size:20px; margin:auto;">▶</div><div class="hl-card" style="border-color:#feca57">${d.next}</div></div>`));
    socket.on('anim_roulette', (d) => vis(`<div style="position:relative"><div class="wheel-marker" style="left:50%; transform:translateX(-50%)"></div><div class="wheel" style="transform:rotate(${d.angle}deg)"></div></div>`));
    socket.on('rps_lock', (d) => document.getElementById(`p${d.seat}Panel`).style.borderColor = '#feca57');
    socket.on('rps_reveal', (d) => { vis(`<div style="font-size:30px;">${d.p1} VS ${d.p2}</div>`); document.getElementById('p1Panel').style.borderColor=''; document.getElementById('p2Panel').style.borderColor=''; });
    socket.on('anim_ttt', (d) => {
        let h = `<div class="ttt-grid">`;
        d.board.forEach((c,i) => h+=`<div class="ttt-cell" onclick="act('ttt', ${i})">${c||''}</div>`);
        h += `</div>`;
        vis(h);
    });
    
    socket.on('match_over', (d) => alert(`${d.name} WINS!`));
    socket.on('error_msg', (m) => alert(m));

    function vis(h) { document.getElementById('visuals').innerHTML = h; }

    function renderUI() {
        document.getElementById('gDisp').innerText = state.settings.game.toUpperCase();
        document.getElementById('rDisp').innerText = state.settings.targetScore;
        document.getElementById('wDisp').innerText = state.settings.wager;
        document.getElementById('p1Score').innerText = state.scores[1];
        document.getElementById('p2Score').innerText = state.scores[2];
        
        updateSeat(1); updateSeat(2);

        document.getElementById('p1Panel').classList.remove('active-turn');
        document.getElementById('p2Panel').classList.remove('active-turn');
        if(state.matchActive && state.settings.game !== 'rps') document.getElementById(`p${state.turn}Panel`).classList.add('active-turn');

        const showSet = (state.seats[1] === me && !state.matchActive && !state.seats[2]);
        document.getElementById('settingsPanel').style.display = showSet ? 'block' : 'none';
        
        // TTT Board Persistence
        if(state.settings.game === 'ttt' && state.matchActive) {
            let h = `<div class="ttt-grid">`;
            state.temp.tttBoard.forEach((c,i) => h+=`<div class="ttt-cell" onclick="act('ttt', ${i})">${c||''}</div>`);
            h += `</div>`;
            vis(h);
        }
        
        // Betting Lock UI
        document.getElementById('betAmt').disabled = state.bettingLocked;
    }

    function updateSeat(n) {
        const div = document.getElementById(`p${n}Controls`);
        const p = state.seats[n];
        document.getElementById(`p${n}Name`).innerText = p || "EMPTY";
        
        if (p === me) {
            if (state.matchActive) {
                div.innerHTML = `<div style="font-size:8px; color:#aaa; text-align:center;">LOCKED</div>`;
                // Show Controls if My Turn OR RPS
                if (state.turn === n || state.settings.game === 'rps') {
                    const G = state.settings.game;
                    if(G==='dice') div.innerHTML+=`<button class="btn btn-green" onclick="act('roll')">ROLL</button>`;
                    if(G==='coin') div.innerHTML+=`<button class="btn btn-green" onclick="actC('H')">HEADS</button><button class="btn btn-green" onclick="actC('T')">TAILS</button>`;
                    if(G==='hl') div.innerHTML+=`<button class="btn btn-green" onclick="actC('high')">HI</button><button class="btn btn-green" onclick="actC('low')">LO</button>`;
                    if(G==='roulette') div.innerHTML+=`<button class="btn btn-green" onclick="actC('RED')">RED</button><button class="btn btn-green" onclick="actC('BLACK')">BLK</button>`;
                    if(G==='rps') div.innerHTML+=`<div style="display:flex; gap:2px;"><button class="btn" onclick="actC('R')">R</button><button class="btn" onclick="actC('P')">P</button><button class="btn" onclick="actC('S')">S</button></div>`;
                    if(G==='ttt') div.innerHTML+=`<div style="font-size:8px;">TAP GRID</div>`;
                }
            } else div.innerHTML = `<button class="btn btn-red" onclick="leave()">LEAVE</button>`;
        } else if (!p) div.innerHTML = `<button class="btn" onclick="reqSeat(${n})">SIT</button>`;
        else div.innerHTML = `<div style="font-size:8px; color:#666; text-align:center;">OCCUPIED</div>`;
    }

    function reqSeat(n) { socket.emit('request_seat', n); }
    function leave() { socket.emit('leave_seat'); }
    function submitSettings() { socket.emit('update_settings', { game: document.getElementById('setGame').value, targetScore: document.getElementById('setRounds').value, wager: document.getElementById('setWager').value }); }
    function act(action, index) { socket.emit('game_action', { action, index }); }
    function actC(guess) { socket.emit('game_action', { guess }); }
    function getDie(v) { return `<div class="die" v="${v}"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`; }
</script>
</body>
</html>
