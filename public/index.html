<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STICK N' DUEL</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0d0d10; --p1: #ff4757; --p2: #2e86de; --acc: #feca57; --text: #fff; }
        * { box-sizing: border-box; }
        
        body {
            background-color: var(--bg); color: var(--text);
            font-family: 'Press Start 2P', cursive;
            margin: 0; height: 100vh; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* --- MAIN CONTAINER (COMPACT) --- */
        .app-container {
            width: 95vw; height: 90vh;
            display: flex; gap: 15px;
            background: rgba(0,0,0,0.8);
            border: 4px solid #333;
            padding: 15px;
            box-shadow: 0 0 50px #000;
        }

        /* --- LEFT: GAME ARENA --- */
        .arena-section { flex: 1; display: flex; flex-direction: column; }
        
        .top-stats {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 10px;
        }
        .game-tabs { display: flex; gap: 5px; }
        .tab { background: #222; border: 1px solid #444; color: #555; padding: 8px; font-size: 8px; cursor: pointer; }
        .tab.active { background: #333; color: var(--acc); border-color: var(--acc); }

        .battle-grid {
            display: grid; grid-template-columns: 200px 1fr 200px; gap: 10px;
            flex-grow: 1; min-height: 0;
        }

        /* PLAYER PANELS */
        .p-panel {
            background: #111; border: 2px solid #333;
            display: flex; flex-direction: column; align-items: center;
            position: relative; transition: 0.2s;
        }
        .p1 { border-color: #555; } .p1.active { border-color: var(--p1); box-shadow: 0 0 20px var(--p1); }
        .p2 { border-color: #555; } .p2.active { border-color: var(--p2); box-shadow: 0 0 20px var(--p2); }
        
        .p-head { width: 100%; padding: 10px; background: #222; text-align: center; font-size: 10px; }
        .p1 .p-head { color: var(--p1); } .p2 .p-head { color: var(--p2); }
        
        .p-avatar { width: 60px; height: 60px; background: #000; border: 2px solid #333; margin-top: 20px; }
        .p-score { font-size: 40px; font-family: 'Rajdhani'; margin-top: 10px; }
        .p-btn { margin-top: auto; margin-bottom: 20px; width: 80%; padding: 10px; background: #333; border: 1px solid #fff; color: #fff; cursor: pointer; font-family: inherit; font-size: 8px; }
        .p-btn:hover { background: #444; }

        /* CENTER STAGE */
        .stage {
            background: #000; border: 2px solid #333;
            display: flex; flex-direction: column;
            position: relative;
        }
        .status-bar { background: #222; padding: 5px; text-align: center; font-size: 8px; color: var(--acc); }
        .visuals { flex-grow: 1; display: flex; justify-content: center; align-items: center; }

        /* --- RIGHT: SIDEBAR --- */
        .sidebar { width: 280px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
        
        .box { background: #111; border: 2px solid #333; display: flex; flex-direction: column; }
        .box-head { background: #222; padding: 8px; font-size: 8px; border-bottom: 2px solid #333; color: #aaa; }
        
        /* BETTING */
        .bet-ui { padding: 10px; background: #0d0d0d; }
        .wallet { text-align: center; color: var(--acc); font-size: 10px; margin-bottom: 10px; }
        .bet-btns { display: flex; gap: 5px; margin-bottom: 10px; }
        .b-sel { flex: 1; background: #222; border: 1px solid #444; color: #555; padding: 8px; cursor: pointer; font-family: inherit; font-size: 8px; }
        .b-sel.p1.sel { background: var(--p1); color: #fff; } .b-sel.p2.sel { background: var(--p2); color: #fff; }
        .std-inp { width: 100%; background: #000; border: 1px solid #444; color: #fff; padding: 8px; text-align: center; font-family: inherit; margin-bottom: 10px; font-size: 10px; }
        .act-btn { width: 100%; background: #2ecc71; color: #000; padding: 10px; border: none; cursor: pointer; font-family: inherit; font-size: 10px; }
        .act-btn:disabled { background: #333; color: #555; cursor: not-allowed; }

        /* CHAT & PLAYERS */
        .list { height: 100px; overflow-y: auto; padding: 5px; font-family: 'Rajdhani'; font-size: 12px; }
        .chat-log { flex-grow: 1; overflow-y: auto; padding: 5px; font-family: 'Rajdhani'; font-size: 12px; background: #000; height: 150px; }
        .chat-msg { margin-bottom: 4px; }

        /* MODALS */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; border: 4px solid #fff; padding: 30px; z-index: 2000; width: 350px; text-align: center; display: none; box-shadow: 0 0 0 100vw rgba(0,0,0,0.8); }
        .modal-active { display: block; }
        
        /* DICE */
        .dice-row { display: flex; gap: 10px; }
        .die { width: 40px; height: 40px; background: #fff; border: 2px solid #000; border-radius: 4px; display: grid; grid-template-columns: repeat(3, 1fr); padding: 2px; }
        .dot { background: #000; border-radius: 50%; visibility: hidden; }
        .die[v="1"] .dot:nth-child(5){visibility:visible} .die[v="2"] .dot:nth-child(1),.die[v="2"] .dot:nth-child(9){visibility:visible} .die[v="3"] .dot:nth-child(1),.die[v="3"] .dot:nth-child(5),.die[v="3"] .dot:nth-child(9){visibility:visible} .die[v="4"] .dot:nth-child(1),.die[v="4"] .dot:nth-child(3),.die[v="4"] .dot:nth-child(7),.die[v="4"] .dot:nth-child(9){visibility:visible} .die[v="5"] .dot:nth-child(1),.die[v="5"] .dot:nth-child(3),.die[v="5"] .dot:nth-child(5),.die[v="5"] .dot:nth-child(7),.die[v="5"] .dot:nth-child(9){visibility:visible} .die[v="6"] .dot:nth-child(1),.die[v="6"] .dot:nth-child(3),.die[v="6"] .dot:nth-child(4),.die[v="6"] .dot:nth-child(6),.die[v="6"] .dot:nth-child(7),.die[v="6"] .dot:nth-child(9){visibility:visible}
    </style>
</head>
<body>

    <div class="modal modal-active" id="authModal">
        <h2 style="color:var(--acc);">STICK N' DUEL</h2>
        <input id="uInput" class="std-inp" placeholder="USERNAME">
        <input id="pInput" type="password" class="std-inp" placeholder="PASSWORD">
        <div style="display:flex; gap:10px;">
            <button class="act-btn" style="background:#007bff; color:#fff;" onclick="auth('login')">LOGIN</button>
            <button class="act-btn" style="background:transparent; border:2px solid #fff; color:#fff;" onclick="auth('signup')">SIGN UP</button>
        </div>
    </div>

    <div class="modal" id="bankModal">
        <h3 style="color:var(--acc);">BANK</h3>
        <select id="bankType" class="std-inp"><option value="deposit">DEPOSIT</option><option value="withdraw">WITHDRAW</option><option value="ticket">TICKET</option></select>
        <input id="bankVal" class="std-inp" placeholder="AMOUNT / MSG">
        <button class="act-btn" onclick="submitBank()">SUBMIT</button>
        <div style="margin-top:10px; font-size:8px; cursor:pointer;" onclick="toggleBank(false)">CLOSE</div>
    </div>

    <div class="modal" id="propModal">
        <h3 style="color:var(--acc);">HOST MATCH</h3>
        <select id="sGame" class="std-inp"><option value="dice">DICE</option><option value="coin">COIN</option><option value="rps">RPS</option></select>
        <select id="sRounds" class="std-inp"><option value="1|SUDDEN DEATH">1 ROUND</option><option value="3|BEST OF 3">BEST OF 3</option></select>
        <input id="sWager" class="std-inp" placeholder="WAGER" type="number">
        <button class="act-btn" onclick="sendProp()">PROPOSE</button>
    </div>

    <div class="modal" id="accModal">
        <h3 style="color:var(--acc);">CHALLENGE</h3>
        <div id="propTxt" style="font-size:10px; color:#aaa; margin-bottom:15px;"></div>
        <button class="act-btn" onclick="resp(true)">ACCEPT</button>
        <button class="act-btn" style="background:#ff4757; margin-top:5px;" onclick="resp(false)">DECLINE</button>
    </div>

    <div class="app-container">
        <div class="arena-section">
            <div class="top-stats">
                <div style="color:var(--acc);">CASINO</div>
                <div id="targetTxt" style="font-size:8px; color:#aaa;">TARGET: 1</div>
                <button class="b-sel" style="width:auto;" onclick="toggleBank(true)">WALLET: <span id="myBal">0</span></button>
            </div>

            <div class="game-tabs">
                <div class="tab" id="t-dice">DICE</div>
                <div class="tab" id="t-coin">COIN</div>
                <div class="tab" id="t-rps">RPS</div>
            </div>

            <div class="battle-grid">
                <div class="p-panel p1" id="p1Panel">
                    <div class="p-head">PLAYER 1</div>
                    <div class="p-avatar"></div>
                    <div class="p-score" id="p1Score">0</div>
                    <button id="btnP1" class="p-btn" onclick="reqSeat(1)">SIT</button>
                </div>

                <div class="stage">
                    <div class="status-bar" id="status">WAITING...</div>
                    <div class="visuals" id="vis">VS</div>
                </div>

                <div class="p-panel p2" id="p2Panel">
                    <div class="p-head">PLAYER 2</div>
                    <div class="p-avatar"></div>
                    <div class="p-score" id="p2Score">0</div>
                    <button id="btnP2" class="p-btn" onclick="reqSeat(2)">SIT</button>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="box">
                <div class="box-head">BETTING</div>
                <div class="bet-ui">
                    <div class="bet-btns">
                        <button class="b-sel p1" id="b1" onclick="selBet(1)">P1</button>
                        <button class="b-sel p2" id="b2" onclick="selBet(2)">P2</button>
                    </div>
                    <input id="betAmt" class="std-inp" placeholder="AMOUNT">
                    <button id="plBet" class="act-btn" onclick="placeBet()">PLACE BET</button>
                </div>
            </div>

            <div class="box">
                <div class="box-head">PLAYERS</div>
                <div class="list" id="pList"></div>
            </div>

            <div class="box" style="flex:1;">
                <div class="box-head">CHAT</div>
                <div class="chat-log" id="cLog"></div>
                <input class="std-inp" style="border:none; border-top:2px solid #333; margin:0;" placeholder="Type..." onkeypress="sendChat(event)">
            </div>
        </div>
    </div>

<script>
    const socket = io();
    let me=null, state={}, betTarg=null;

    // --- AUTH ---
    function auth(type){
        const u=document.getElementById('uInput').value;
        const p=document.getElementById('pInput').value;
        if(u&&p) socket.emit('auth', {type, username:u, password:p});
    }
    socket.on('auth_success', d => {
        me = d.username;
        document.getElementById('authModal').style.display = 'none';
        updBal(d.balance);
    });
    socket.on('auth_fail', m => alert(m));
    socket.on('balance_update', b => updBal(b));
    function updBal(b){ document.getElementById('myBal').innerText=b; }

    // --- BANKING ---
    function toggleBank(show){ document.getElementById('bankModal').style.display = show?'block':'none'; }
    function submitBank(){
        const t = document.getElementById('bankType').value;
        const v = document.getElementById('bankVal').value;
        const msg = t==='ticket'?v:'';
        socket.emit('wallet_action', {type:t, amount:v, msg});
        toggleBank(false);
    }
    socket.on('alert', m => alert(m));

    // --- LOBBY & NEGOTIATION ---
    function reqSeat(n){ socket.emit('request_seat', n); }
    socket.on('prompt_proposal', () => document.getElementById('propModal').style.display='block');
    
    function sendProp(){
        const r = document.getElementById('sRounds').value.split('|');
        socket.emit('propose_terms', {
            game: document.getElementById('sGame').value,
            targetScore: r[0], roundLabel: r[1],
            wager: document.getElementById('sWager').value
        });
        document.getElementById('propModal').style.display='none';
    }
    
    socket.on('review_terms', t => {
        document.getElementById('accModal').style.display='block';
        document.getElementById('propTxt').innerText = `${t.game.toUpperCase()} | ${t.roundLabel} | ${t.wager} TC`;
    });
    function resp(ok){ socket.emit('respond_terms', ok); document.getElementById('accModal').style.display='none'; }

    // --- GAME STATE ---
    socket.on('state_update', s => { state=s; render(); });
    socket.on('game_reset', g => {
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        document.getElementById(`t-${g}`).classList.add('active');
    });

    function render(){
        document.getElementById('status').innerText = state.statusText;
        document.getElementById('p1Score').innerText = state.scores[1];
        document.getElementById('p2Score').innerText = state.scores[2];
        
        // Panels
        document.getElementById('p1Panel').className = `p-panel p1 ${state.matchActive && state.turn===1?'active':''}`;
        document.getElementById('p2Panel').className = `p-panel p2 ${state.matchActive && state.turn===2?'active':''}`;

        // Controls
        btnState(1); btnState(2);

        // Betting
        document.getElementById('plBet').disabled = state.bettingLocked || !state.negotiating;
    }

    function btnState(n){
        const user = state.seats[n];
        const btn = document.getElementById(`btnP${n}`);
        if(user === me){
            if(state.matchActive && state.turn === n) btn.innerText = "PLAY"; 
            else if(state.matchActive) btn.innerText = "WAIT";
            else btn.innerText = "LEAVE";
            btn.onclick = () => {
                if(state.matchActive && state.turn === n) socket.emit('game_action', {action:'roll'}); // Simplified
                else if(!state.matchActive) socket.emit('leave_seat');
            };
        } else if(user) {
            btn.innerText = user; btn.onclick = null;
        } else {
            btn.innerText = "SIT"; btn.onclick = () => reqSeat(n);
        }
    }

    // --- BETTING ---
    function selBet(n){ betTarg=n; document.getElementById('b1').classList.toggle('sel', n===1); document.getElementById('b2').classList.toggle('sel', n===2); }
    function placeBet(){ 
        const v = document.getElementById('betAmt').value;
        if(v && betTarg) socket.emit('place_bet', {amount:v, target:betTarg});
    }

    // --- VISUALS ---
    socket.on('anim_dice', d => {
        document.getElementById('vis').innerHTML = `<div class="dice-row">${d.roll.map(v=>getDie(v)).join('')}</div>`;
    });
    function getDie(v){ return `<div class="die" v="${v}"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`; }

    // --- CHAT & PLAYERS ---
    socket.on('player_joined', d => {
        document.getElementById('pList').innerHTML += `<div>${d.username}</div>`;
    });
    function sendChat(e){ if(e.key==='Enter'){ socket.emit('chat_msg', e.target.value); e.target.value=''; }}
    socket.on('chat_msg', d => {
        const l = document.getElementById('cLog');
        l.innerHTML += `<div class="chat-msg"><span style="color:${d.color}">${d.user}:</span> ${d.text}</div>`;
        l.scrollTop = l.scrollHeight;
    });

</script>
</body>
</html>
