<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASINO DUEL ARENA - ONLINE</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- COPY YOUR ORIGINAL CSS HERE --- */
        /* To ensure the answer fits, I am using the styles I cleaned up for you in the previous steps. */
        :root { --bg-dark: #121216; --bg-panel: #1e1e24; --p1-color: #ff4757; --p2-color: #2e86de; --accent: #feca57; --text: #ffffff; --grid-line: rgba(255, 255, 255, 0.05); --sidebar-width: 340px; --betting-height: 265px; --players-height: 320px; }
        * { box-sizing: border-box; }
        body { background-color: var(--bg-dark); background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px); background-size: 20px 20px; color: var(--text); font-family: 'Press Start 2P', cursive; margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; display: flex; }
        .custom-scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: transparent transparent; }
        .main-wrapper { display: flex; width: 100%; height: 100%; padding: 20px; gap: 20px; overflow: hidden; height: 100vh; min-height: 0; }
        .game-section { flex-grow: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; min-width: 0; flex: 1 1 auto; min-height: 0; }
        .social-sidebar { width: var(--sidebar-width); min-width: var(--sidebar-width); display: flex; flex-direction: column; gap: 15px; height: 100%; overflow: hidden; flex: 0 0 var(--sidebar-width); min-height: 0; }
        .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 4px solid #333; padding-bottom: 15px; flex-shrink: 0; }
        h1 { color: var(--accent); font-size: 20px; text-shadow: 3px 3px 0 #000; margin: 0; }
        .game-selector { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; background: #000; padding: 10px; border: 2px solid #333; border-radius: 8px; flex-shrink: 0; }
        .game-tab { background: #333; border: 2px solid #555; color: #aaa; padding: 10px 15px; font-size: 10px; font-family: 'Press Start 2P'; cursor: pointer; transition: all 0.2s; }
        .game-tab.active { background: var(--accent); color: #000; border-color: #fff; box-shadow: 0 0 10px var(--accent); z-index: 2; }
        .arena-container { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 25px; align-items: stretch; flex-grow: 1; min-height: 0; padding: 10px; overflow: hidden; }
        .player-hud { background: var(--bg-panel); border: 4px solid #000; display: flex; flex-direction: column; position: relative; box-shadow: 4px 4px 0 #000; transition: all 0.3s ease; height: 100%; z-index: 1; }
        .player-header { padding: 10px; text-align: center; border-bottom: 4px solid #000; font-size: 12px; height: 40px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;}
        .p1-hud { border-color: #555; } .p1-hud .player-header { background: #333; color: #fff; }
        .p2-hud { border-color: #555; } .p2-hud .player-header { background: #333; color: #fff; }
        .score-area { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; min-height: 0; }
        .score-display { font-size: 60px; font-family: 'Rajdhani', sans-serif; font-weight: 700; }
        .controls-area { padding: 15px; flex-grow: 0; display: flex; flex-direction: column; gap: 10px; justify-content: center; min-height: 120px; background: rgba(0,0,0,0.2); flex-shrink: 0; }
        .seat-btn { width: 100%; padding: 20px; background: #333; color: #aaa; border: 2px dashed #666; font-family: 'Press Start 2P'; cursor: pointer; font-size: 10px; text-transform: uppercase; margin-top: auto; margin-bottom: auto; transition: all 0.2s; }
        .seat-btn:hover { color: #fff; border-color: #fff; background: #444; transform: scale(1.05); }
        .center-stage { background: #000; border: 4px solid #333; display: flex; flex-direction: column; position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); height: 100%; }
        .marquee-status { background: #111; border-bottom: 2px solid #444; color: #888; text-align: center; padding: 10px; font-size: 10px; letter-spacing: 1px; min-height: 35px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;}
        .game-board { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; overflow: hidden; perspective: 1000px; min-height: 0;}
        .vs-badge { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 60px; font-weight: 900; color: rgba(255, 255, 255, 0.03); font-family: 'Rajdhani', sans-serif; pointer-events: none; z-index: 0; }
        .sidebar-panel { background: var(--bg-panel); border: 4px solid #000; display: flex; flex-direction: column; min-height: 0; overflow: hidden; box-shadow: 4px 4px 0 #000; flex-shrink: 0; }
        .panel-header { background: #2f3640; color: #fff; padding: 8px; padding-left: 15px; font-size: 10px; border-bottom: 4px solid #000; text-transform: uppercase; font-weight: bold; flex-shrink: 0; }
        /* BETTING */
        .betting-panel { padding: 15px; border-bottom: 4px solid #000; background: #191919; }
        .betting-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); z-index: 10; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 10px; text-align: center; padding: 20px; font-family: 'Press Start 2P'; line-height: 1.5; }
        .betting-wrapper { position: relative; height: var(--betting-height); flex: 0 0 var(--betting-height); }
        .wallet { text-align: center; color: var(--accent); margin-bottom: 10px; font-size: 10px; }
        .bet-input { width: 100%; background: #000; border: 2px solid #555; color: #fff; padding: 15px 10px; font-family: 'Press Start 2P'; font-size: 10px; text-align: center; margin-bottom: 5px; height: 45px; }
        .place-bet-btn { width: 100%; background: #2ecc71; color: #000; border: 2px solid #000; padding: 12px; font-family: 'Press Start 2P'; cursor: pointer; font-size: 10px; margin-top: 5px; }
        /* CHAT */
        .chat-container-box { flex: 1 1 auto; min-height: 0; margin-bottom: 0; }
        .chat-inner { flex-grow: 1; display: flex; flex-direction: column; background: #1e1e24; min-height: 0; overflow: hidden; }
        .chat-log { flex-grow: 1; padding: 15px; font-size: 14px; line-height: 1.5; color: #ccc; font-family: 'Rajdhani', sans-serif; font-weight: 600; overflow-y: auto; }
        .chat-msg { margin-bottom: 8px; word-wrap: break-word; }
        .chat-input-area { display: flex; border-top: 4px solid #000; flex-shrink: 0; }
        .chat-input { flex-grow: 1; background: #000; border: none; color: #fff; padding: 15px; font-family: 'Press Start 2P'; font-size: 12px; outline: none; height: 50px; }
        /* AUTH */
        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .auth-box { background: #1e1e24; border: 4px solid var(--accent); padding: 40px; width: 400px; text-align: center; box-shadow: 0 0 50px rgba(254, 202, 87, 0.2); }
        .auth-input { width: 100%; padding: 15px; margin-bottom: 15px; background: #000; border: 2px solid #555; color: #fff; font-family: 'Press Start 2P'; font-size: 12px; }
        .auth-btn { width: 100%; padding: 15px; background: var(--accent); color: #000; border: none; font-family: 'Press Start 2P'; cursor: pointer; font-size: 14px; text-transform: uppercase; }
        /* ASSETS */
        .arcade-btn { position: relative; display: block; width: 100%; padding: 12px 5px; font-family: 'Press Start 2P'; font-size: 10px; text-transform: uppercase; border: none; cursor: pointer; background: none; margin-bottom: 5px; }
        .arcade-btn::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #444; border: 3px solid #000; box-shadow: inset 2px 2px 0 rgba(255,255,255,0.2), 4px 4px 0 #000; z-index: -1; transition: all 0.1s; }
        .p1-btn::before { background: var(--p1-color); } .p2-btn::before { background: var(--p2-color); }
        .arcade-btn:active::before { transform: translate(3px, 3px); box-shadow: inset 2px 2px 0 rgba(0,0,0,0.2), 1px 1px 0 #000; }
        .dice-row { display: flex; gap: 10px; z-index: 1; }
        .die { width: 70px; height: 70px; background: #fff; border: 4px solid #000; border-radius: 8px; display: grid; grid-template-columns: repeat(3, 1fr); padding: 5px; box-shadow: 4px 4px 0 rgba(0,0,0,0.5); }
        .dot { background: #000; width: 14px; height: 14px; border-radius: 50%; margin: auto; visibility: hidden; }
        .die[v="1"] .dot:nth-child(5){visibility:visible} .die[v="2"] .dot:nth-child(1),.die[v="2"] .dot:nth-child(9){visibility:visible} .die[v="3"] .dot:nth-child(1),.die[v="3"] .dot:nth-child(5),.die[v="3"] .dot:nth-child(9){visibility:visible} .die[v="4"] .dot:nth-child(1),.die[v="4"] .dot:nth-child(3),.die[v="4"] .dot:nth-child(7),.die[v="4"] .dot:nth-child(9){visibility:visible} .die[v="5"] .dot:nth-child(1),.die[v="5"] .dot:nth-child(3),.die[v="5"] .dot:nth-child(5),.die[v="5"] .dot:nth-child(7),.die[v="5"] .dot:nth-child(9){visibility:visible} .die[v="6"] .dot:nth-child(1),.die[v="6"] .dot:nth-child(3),.die[v="6"] .dot:nth-child(4),.die[v="6"] .dot:nth-child(6),.die[v="6"] .dot:nth-child(7),.die[v="6"] .dot:nth-child(9){visibility:visible}
        .shaking { animation: shake 0.5s infinite; }
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 25% { transform: translate(-2px, -2px) rotate(2deg); } 50% { transform: translate(2px, 0px) rotate(-2deg); } 75% { transform: translate(-1px, 2px) rotate(1deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
        .coin-container { perspective: 1000px; width: 140px; height: 140px; z-index: 1; }
        .coin { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 2.5s cubic-bezier(0.1, 0, 0.2, 1); }
        .coin-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 50%; border: 6px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: bold; box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .coin-front { background: #feca57; color: #000; } .coin-back { background: #ff9f43; color: #000; transform: rotateY(180deg); }
        .wheel-container { position: relative; z-index: 1; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5)); }
        .wheel { width: 200px; height: 200px; border-radius: 50%; background: conic-gradient(#d32f2f 0deg 60deg, #111 60deg 120deg, #d32f2f 120deg 180deg, #111 180deg 240deg, #d32f2f 240deg 300deg, #111 300deg 360deg); border: 6px solid #fff; transition: transform 3s cubic-bezier(0.1, 0.7, 0.1, 1); }
        .wheel-marker { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 24px solid #f4b41b; z-index: 5; }
        .hl-card-wrap { width: 100px; height: 150px; position: relative; perspective: 1000px; z-index: 1; }
        .hl-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .hl-card-front, .hl-card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 4px solid #fff; font-size: 40px; color: #000; }
        .hl-card-front { background: #fff; border-color: #000; }
        .hl-card-back { background: #c0392b; color: #f1c40f; transform: rotateY(180deg); }
        .flipped .hl-card-inner { transform: rotateY(180deg); }
        .rps-card { font-size: 60px; font-weight: bold; padding: 20px; background: #fff; border: 4px solid #000; border-radius: 10px; min-width: 140px; height: 140px; text-align: center; display: flex; align-items: center; justify-content: center; color: #000; font-family: 'Press Start 2P', 'Segoe UI Emoji', sans-serif; }
        .ttt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; z-index: 1; background: #333; padding: 5px; border-radius: 5px; }
        .ttt-cell { width: 60px; height: 60px; background: #222; display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; color: #fff; border: 1px solid #444; }
        .ttt-cell.filled { background: #333; } .ttt-cell:hover:not(.filled) { background: #444; }
    </style>
</head>
<body>

    <div id="authOverlay">
        <div class="auth-box">
            <h1 style="color: var(--accent); margin-bottom: 30px;">DUEL ARENA</h1>
            <p style="font-size:10px; color:#aaa; margin-bottom:20px;">ENTER USERNAME TO SIGN IN OR SIGN UP</p>
            <input type="text" id="usernameInput" class="auth-input" placeholder="USERNAME">
            <input type="password" id="passwordInput" class="auth-input" placeholder="PASSWORD">
            <button class="auth-btn" onclick="authenticate()">START GAME</button>
            <div id="authError" style="color: #ff4757; font-size: 10px; margin-top: 15px;"></div>
        </div>
    </div>

    <div class="main-wrapper">
        <div class="game-section">
            <div class="top-bar">
                <h1>CASINO</h1>
                <div style="font-size:10px; color:#aaa;" id="connectionStatus">CONNECTED</div>
            </div>

            <div class="game-selector">
                <button onclick="changeGame('dice')" class="game-tab active" id="tab-dice">DICE</button>
                <button onclick="changeGame('coin')" class="game-tab" id="tab-coin">COIN</button>
                <button onclick="changeGame('hl')" class="game-tab" id="tab-hl">HI-LO</button>
                <button onclick="changeGame('roulette')" class="game-tab" id="tab-roulette">ROULETTE</button>
                <button onclick="changeGame('rps')" class="game-tab" id="tab-rps">R.P.S.</button>
                <button onclick="changeGame('ttt')" class="game-tab" id="tab-ttt">TTT</button>
            </div>

            <div class="arena-container">
                <div class="player-hud p1-hud" id="p1Panel">
                    <div class="player-header"><div id="p1Name">EMPTY</div></div>
                    <div class="score-area"><div class="score-display" id="p1Score">0</div></div>
                    <div class="controls-area" id="p1Controls">
                        <button class="seat-btn" id="btnSeat1" onclick="requestSeat(1)">TAKE SEAT</button>
                    </div>
                </div>

                <div class="center-stage">
                    <div class="marquee-status" id="status">WAITING FOR PLAYERS...</div>
                    <div class="game-board" id="gameVisuals"><div class="vs-badge">VS</div></div>
                </div>

                <div class="player-hud p2-hud" id="p2Panel">
                    <div class="player-header"><div id="p2Name">EMPTY</div></div>
                    <div class="score-area"><div class="score-display" id="p2Score">0</div></div>
                    <div class="controls-area" id="p2Controls">
                        <button class="seat-btn" id="btnSeat2" onclick="requestSeat(2)">TAKE SEAT</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="social-sidebar">
            <div class="sidebar-panel betting-wrapper">
                <div class="panel-header">SPECTATOR BETTING</div>
                <div class="betting-panel">
                    <div class="wallet" id="walletDisplay">WALLET: 0 TC</div>
                    <div style="font-size:9px; color:#666; text-align:center; margin-bottom:5px;">ENTER AMOUNT</div>
                    <input type="number" id="betAmount" class="bet-input" placeholder="AMOUNT" min="10">
                    <button class="place-bet-btn" id="placeBetBtn">PLACE BET (Coming Soon)</button>
                </div>
                <div class="betting-overlay" id="betOverlay">WAITING FOR<br>2 PLAYERS...</div>
            </div>

            <div class="sidebar-panel chat-container-box">
                <div class="panel-header">LIVE CHAT</div>
                <div class="chat-inner">
                    <div class="chat-log custom-scroll" id="chatLog"></div>
                    <div class="chat-input-area">
                        <input type="text" class="chat-input" id="chatInput" placeholder="Type here..." onkeypress="handleChat(event)">
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    const socket = io();
    let me = { name: null, seat: null };
    let currentState = { gameType: 'dice', seats: {} };

    // --- AUTH ---
    function authenticate() {
        const u = document.getElementById('usernameInput').value;
        const p = document.getElementById('passwordInput').value;
        if(u && p) socket.emit('auth', { username: u, password: p });
    }
    socket.on('auth_success', (data) => {
        me.name = data.username;
        document.getElementById('walletDisplay').innerText = `WALLET: ${data.balance} TC`;
        document.getElementById('authOverlay').style.display = 'none';
    });
    socket.on('auth_fail', (msg) => document.getElementById('authError').innerText = msg);

    // --- STATE SYNC ---
    socket.on('state_update', (state) => {
        currentState = state;
        updateSeatUI(state.seats);
        setupVisuals(state.gameType);
        updateActiveTab(state.gameType);
    });

    socket.on('update_seats', (seats) => {
        currentState.seats = seats;
        updateSeatUI(seats);
        checkBetLock();
    });

    socket.on('set_game', (game) => {
        currentState.gameType = game;
        updateActiveTab(game);
        setupVisuals(game);
    });

    socket.on('lock_betting', (isLocked) => {
        const ov = document.getElementById('betOverlay');
        if(isLocked) { ov.style.display = 'flex'; ov.innerHTML = "GAME IN<br>PROGRESS..."; }
        else checkBetLock();
    });

    function checkBetLock() {
        const ov = document.getElementById('betOverlay');
        if(currentState.seats[1] && currentState.seats[2]) {
            ov.style.display = 'none';
            document.getElementById('status').innerText = "READY TO DUEL";
        } else {
            ov.style.display = 'flex';
            ov.innerHTML = "WAITING FOR<br>2 PLAYERS...";
            document.getElementById('status').innerText = "WAITING FOR PLAYERS...";
        }
    }

    // --- UI HELPERS ---
    function updateActiveTab(game) {
        document.querySelectorAll('.game-tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-${game}`).classList.add('active');
        // Rerender controls
        updateSeatUI(currentState.seats);
    }

    function requestSeat(n) { socket.emit('request_seat', n); }
    function leaveSeat() { socket.emit('leave_seat'); me.seat = null; }
    function changeGame(g) { if(me.seat) socket.emit('change_game', g); }

    function updateSeatUI(seats) {
        // P1 UI
        document.getElementById('p1Name').innerText = seats[1] || "EMPTY";
        const c1 = document.getElementById('p1Controls');
        if(seats[1] === me.name) {
            me.seat = 1;
            c1.innerHTML = `<button class="seat-btn" onclick="leaveSeat()">LEAVE SEAT</button>` + getControlsHTML(1);
        } else if(seats[1]) {
            c1.innerHTML = `<div style="padding:20px; text-align:center; color:#666; font-size:10px;">OCCUPIED</div>`;
        } else {
            c1.innerHTML = `<button class="seat-btn" onclick="requestSeat(1)">TAKE SEAT</button>`;
        }

        // P2 UI
        document.getElementById('p2Name').innerText = seats[2] || "EMPTY";
        const c2 = document.getElementById('p2Controls');
        if(seats[2] === me.name) {
            me.seat = 2;
            c2.innerHTML = `<button class="seat-btn" onclick="leaveSeat()">LEAVE SEAT</button>` + getControlsHTML(2);
        } else if(seats[2]) {
            c2.innerHTML = `<div style="padding:20px; text-align:center; color:#666; font-size:10px;">OCCUPIED</div>`;
        } else {
            c2.innerHTML = `<button class="seat-btn" onclick="requestSeat(2)">TAKE SEAT</button>`;
        }
    }

    function getControlsHTML(seat) {
        const g = currentState.gameType;
        let html = '<br>';
        if(g==='dice') html+=`<button class="arcade-btn p${seat}-btn" onclick="socket.emit('action_dice', ${seat})">ROLL</button>`;
        if(g==='coin') {
            html+=`<button class="arcade-btn p${seat}-btn" onclick="socket.emit('action_coin', {seat:${seat}, guess:'H'})">HEADS</button>`;
            html+=`<button class="arcade-btn p${seat}-btn" onclick="socket.emit('action_coin', {seat:${seat}, guess:'T'})">TAILS</button>`;
        }
        if(g==='hl') {
            html+=`<button class="arcade-btn p${seat}-btn" onclick="socket.emit('action_hl', {seat:${seat}, guess:'high'})">HIGHER</button>`;
            html+=`<button class="arcade-btn p${seat}-btn" onclick="socket.emit('action_hl', {seat:${seat}, guess:'low'})">LOWER</button>`;
        }
        if(g==='roulette') {
            html+=`<button class="arcade-btn p${seat}-btn" onclick="socket.emit('action_roulette', {seat:${seat}, guess:'RED'})">RED</button>`;
            html+=`<button class="arcade-btn p${seat}-btn" onclick="socket.emit('action_roulette', {seat:${seat}, guess:'BLACK'})">BLACK</button>`;
        }
        if(g==='rps') {
            html+=`<button class="arcade-btn p${seat}-btn" onclick="socket.emit('action_rps', {seat:${seat}, choice:'R'})">ROCK</button>`;
            html+=`<button class="arcade-btn p${seat}-btn" onclick="socket.emit('action_rps', {seat:${seat}, choice:'P'})">PAPER</button>`;
            html+=`<button class="arcade-btn p${seat}-btn" onclick="socket.emit('action_rps', {seat:${seat}, choice:'S'})">SCISSOR</button>`;
        }
        if(g==='ttt') html+= `<div style="text-align:center; font-size:10px; color:#aaa;">TAP GRID</div>`;
        return html;
    }

    // --- GAME ANIMATIONS ---
    function setupVisuals(g) {
        const v = document.getElementById('gameVisuals');
        if(g==='dice') {
            v.innerHTML = `<div style="display:flex; flex-direction:column; gap:30px; align-items:center;"><div id="p1Dice" class="dice-row"></div><div id="p2Dice" class="dice-row"></div></div>`;
            renderDice('p1Dice',[1,1,1]); renderDice('p2Dice',[1,1,1]);
        }
        else if(g==='coin') v.innerHTML = `<div class="coin-container"><div class="coin" id="coinEl"><div class="coin-face coin-front">H</div><div class="coin-face coin-back">T</div></div></div>`;
        else if(g==='hl') v.innerHTML = `<div class="hl-card-wrap" id="hlWrap"><div class="hl-card-inner"><div class="hl-card-front">7</div><div class="hl-card-back">HI-LO</div></div></div>`;
        else if(g==='roulette') v.innerHTML = `<div class="wheel-container"><div class="wheel-marker"></div><div class="wheel" id="wEl"></div></div>`;
        else if(g==='rps') v.innerHTML = `<div style="display:flex; gap:30px;"><div id="rps1" class="rps-card">?</div><div id="rps2" class="rps-card">?</div></div>`;
        else if(g==='ttt') {
            let h = `<div class="ttt-grid">`;
            for(let i=0; i<9; i++) h+=`<div class="ttt-cell" onclick="socket.emit('action_ttt', {index:${i}, seat:me.seat})"></div>`;
            h+=`</div>`;
            v.innerHTML = h;
        }
    }

    // LISTENING TO ANIMATION EVENTS
    socket.on('anim_dice', (d) => {
        const row = document.getElementById(d.seat===1?'p1Dice':'p2Dice');
        row.childNodes.forEach(x=>x.classList.add('shaking'));
        setTimeout(()=>{
            row.childNodes.forEach(x=>x.classList.remove('shaking'));
            renderDice(d.seat===1?'p1Dice':'p2Dice', d.roll);
            document.getElementById('status').innerText = `P${d.seat} ROLLED ${d.total}`;
        }, 600);
    });

    socket.on('anim_coin', (d) => {
        const el = document.getElementById('coinEl');
        // Simple spin logic
        let angle = 1800; // spin a lot
        if(d.result === 'T') angle += 180;
        el.style.transform = `rotateY(${angle}deg)`;
        setTimeout(()=>{
            document.getElementById('status').innerText = d.win ? `P${d.seat} WON!` : `P${d.seat} LOST!`;
        }, 2500);
    });

    socket.on('anim_hl', (d) => {
        const w = document.getElementById('hlWrap');
        w.classList.add('flipped');
        setTimeout(()=>{
            // Update front (hidden) then flip back
            const f = w.querySelector('.hl-card-front');
            f.innerText = d.next; // Should map 1->A etc, simplified here
            w.classList.remove('flipped');
            document.getElementById('status').innerText = d.win ? `P${d.seat} WON!` : `P${d.seat} LOST!`;
        }, 600);
    });

    socket.on('anim_roulette', (d) => {
        const el = document.getElementById('wEl');
        el.style.transform = `rotate(${d.angle}deg)`;
        setTimeout(()=>{
            document.getElementById('status').innerText = `${d.result}! ` + (d.win ? `P${d.seat} WON!` : `P${d.seat} LOST!`);
        }, 3000);
    });

    socket.on('rps_lock', (seat) => {
        document.getElementById(`rps${seat}`).style.background = "#feca57";
        document.getElementById('status').innerText = `P${seat} LOCKED IN!`;
    });

    socket.on('rps_reveal', (d) => {
        const r1 = document.getElementById('rps1');
        const r2 = document.getElementById('rps2');
        const map = {'R':'✊','P':'✋','S':'✌️'};
        r1.innerText = map[d.p1]; r2.innerText = map[d.p2];
        let msg = "DRAW!";
        if(d.winner === 1) msg = "P1 WINS!";
        if(d.winner === 2) msg = "P2 WINS!";
        document.getElementById('status').innerText = msg;
        setTimeout(()=>{ r1.innerText="?"; r2.innerText="?"; r1.style.background="#fff"; r2.style.background="#fff"; }, 3000);
    });

    socket.on('anim_ttt', (d) => {
        const cells = document.querySelectorAll('.ttt-cell');
        cells[d.index].innerText = d.symbol;
        cells[d.index].classList.add('filled');
    });

    socket.on('ttt_over', (d) => {
        document.getElementById('status').innerText = d.winner ? `P${d.winner} WINS!` : "DRAW!";
        setTimeout(() => setupVisuals('ttt'), 2000);
    });


    // --- HELPERS ---
    function renderDice(id,vals){
        const el=document.getElementById(id); el.innerHTML='';
        vals.forEach(v=>{
            el.innerHTML+=`<div class="die" v="${v}"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
        });
    }

    function handleChat(e) {
        if(e.key === 'Enter' && e.target.value.trim()) {
            socket.emit('chat_msg', e.target.value);
            e.target.value = '';
        }
    }
    socket.on('chat_message', (d) => {
        const l = document.getElementById('chatLog');
        l.innerHTML += `<div class="chat-msg"><span style="color:${d.color}">${d.user}:</span> ${d.text}</div>`;
        l.scrollTop = l.scrollHeight;
    });

    // Start with default Dice
    setupVisuals('dice');

</script>
</body>
</html>
