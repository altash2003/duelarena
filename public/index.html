<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASINO DUEL ARENA</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #121216; --bg-panel: #1e1e24; --accent: #feca57; --text: #fff; --p1: #ff4757; --p2: #2e86de; }
        * { box-sizing: border-box; }
        body { background-color: var(--bg-dark); color: var(--text); font-family: 'Press Start 2P', cursive; margin: 0; height: 100vh; overflow: hidden; display: flex; }
        
        /* TOP BAR CREDITS */
        .credit-bar { position: absolute; top: 10px; right: 20px; font-size: 12px; color: var(--accent); background: #000; padding: 10px; border: 2px solid #333; z-index: 1000; }

        .main-wrapper { display: flex; width: 100%; height: 100%; padding: 20px; gap: 20px; margin-top: 30px; }
        .game-section { flex: 1; display: flex; flex-direction: column; }
        .social-sidebar { width: 320px; display: flex; flex-direction: column; gap: 15px; }

        .arena { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 20px; flex-grow: 1; }
        .player-panel { background: var(--bg-panel); border: 4px solid #333; display: flex; flex-direction: column; align-items: center; transition: 0.3s; position: relative; }
        .player-panel.active-turn { border-color: #2ecc71; box-shadow: 0 0 20px rgba(46,204,113,0.3); }

        .p-name { background: #000; width: 100%; text-align: center; padding: 10px; font-size: 10px; }
        .score { font-size: 60px; font-family: 'Rajdhani'; margin: auto; }
        .controls { width: 100%; padding: 10px; display: flex; flex-direction: column; gap: 5px; }

        .center-stage { background: #000; border: 4px solid #333; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .visuals { width: 100%; display: flex; justify-content: center; align-items: center; flex-grow: 1; perspective: 1000px; }
        
        /* MODALS */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e1e24; border: 4px solid var(--accent); padding: 20px; z-index: 2000; text-align: center; box-shadow: 0 0 50px rgba(0,0,0,0.8); display: none; }
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1500; display: none; }
        
        .btn { width: 100%; padding: 15px; background: #333; color: #fff; border: 2px solid #000; cursor: pointer; font-family: 'Press Start 2P'; font-size: 10px; }
        .btn:hover { background: #444; } .btn-green { background: #2ecc71; color: #000; } .btn-red { background: #ff4757; }
        .input-std { width: 100%; background: #000; border: 2px solid #555; color: #fff; padding: 10px; font-family: 'Press Start 2P'; font-size: 10px; margin-bottom: 5px; }

        /* ANIMATIONS */
        .die { width: 60px; height: 60px; background: #fff; border: 3px solid #000; border-radius: 5px; display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; box-shadow: 4px 4px 0 #000; }
        .dot { background: #000; width: 12px; height: 12px; border-radius: 50%; margin: auto; visibility: hidden; }
        .die[v="1"] .dot:nth-child(5){visibility:visible} .die[v="2"] .dot:nth-child(1),.die[v="2"] .dot:nth-child(9){visibility:visible} .die[v="3"] .dot:nth-child(1),.die[v="3"] .dot:nth-child(5),.die[v="3"] .dot:nth-child(9){visibility:visible} .die[v="4"] .dot:nth-child(1),.die[v="4"] .dot:nth-child(3),.die[v="4"] .dot:nth-child(7),.die[v="4"] .dot:nth-child(9){visibility:visible} .die[v="5"] .dot:nth-child(1),.die[v="5"] .dot:nth-child(3),.die[v="5"] .dot:nth-child(5),.die[v="5"] .dot:nth-child(7),.die[v="5"] .dot:nth-child(9){visibility:visible} .die[v="6"] .dot:nth-child(1),.die[v="6"] .dot:nth-child(3),.die[v="6"] .dot:nth-child(4),.die[v="6"] .dot:nth-child(6),.die[v="6"] .dot:nth-child(7),.die[v="6"] .dot:nth-child(9){visibility:visible}
        .coin { width: 80px; height: 80px; border-radius: 50%; background: #feca57; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #000; font-weight: bold; transition: transform 0.5s; }
        .voice-active { border: 2px solid #2ecc71; box-shadow: 0 0 10px #2ecc71; }
    </style>
</head>
<body>

    <div class="credit-bar" id="topCreditDisplay">CREDITS: 0</div>
    
    <div class="modal" id="authModal" style="display:block;">
        <h1 style="color:var(--accent);">DUEL ARENA</h1>
        <input id="uInput" class="input-std" placeholder="USERNAME">
        <input id="pInput" type="password" class="input-std" placeholder="PASSWORD">
        <button class="btn btn-green" onclick="auth()">ENTER WORLD</button>
    </div>

    <div class="modal-overlay" id="propOverlay"></div>
    <div class="modal" id="proposalModal">
        <h3 style="color:var(--accent);">YOU ARE THE HOST</h3>
        <p style="font-size:10px;">Propose terms to the challenger.</p>
        <select id="setGame" class="input-std"><option value="dice">DICE</option><option value="coin">COIN</option></select>
        <select id="setRounds" class="input-std"><option value="1">1 ROUND</option><option value="3">BEST OF 5</option></select>
        <input type="number" id="setWager" class="input-std" placeholder="WAGER (TC)" value="0">
        <button class="btn btn-green" onclick="submitProposal()">PROPOSE</button>
    </div>

    <div class="modal" id="acceptModal">
        <h3 style="color:var(--accent);">CHALLENGE RECEIVED</h3>
        <p style="font-size:10px;">The host proposes:</p>
        <div id="termDisplay" style="margin:10px; color:#aaa; font-size:12px;"></div>
        <button class="btn btn-green" onclick="respond(true)">ACCEPT MATCH</button>
        <button class="btn btn-red" onclick="respond(false)">DECLINE & LEAVE</button>
    </div>

    <div class="main-wrapper">
        <div class="game-section">
            <div class="arena">
                <div class="player-panel" id="p1Panel">
                    <div class="p-name" id="p1Name">EMPTY</div>
                    <div class="score" id="p1Score">0</div>
                    <div class="controls" id="p1Controls"><button class="btn" onclick="reqSeat(1)">SIT P1</button></div>
                </div>
                <div class="center-stage">
                    <div id="status" style="color:#aaa; font-size:10px; padding:10px;">WAITING...</div>
                    <div class="visuals" id="visuals"><div style="color:#333; font-size:20px;">VS</div></div>
                </div>
                <div class="player-panel" id="p2Panel">
                    <div class="p-name" id="p2Name">EMPTY</div>
                    <div class="score" id="p2Score">0</div>
                    <div class="controls" id="p2Controls"><button class="btn" onclick="reqSeat(2)">SIT P2</button></div>
                </div>
            </div>
        </div>

        <div class="social-sidebar">
            <div style="background:#1e1e24; padding:10px; border:2px solid #333; text-align:center;">
                <div style="font-size:10px; color:#aaa;">VOICE CHAT (PUSH TO TALK: SPACE)</div>
                <div id="voiceStatus" style="font-size:10px; color:#555; margin-top:5px;">DISCONNECTED</div>
            </div>
        </div>
    </div>

<script>
    const socket = io();
    let me = null;
    let state = {};
    
    // VOICE VARIABLES
    let localStream;
    let peerConnection;
    const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    let isTalking = false;

    // 1. AUTH & CREDITS
    function auth() {
        const u = document.getElementById('uInput').value;
        const p = document.getElementById('pInput').value;
        if(u && p) socket.emit('auth', { username: u, password: p });
    }
    socket.on('auth_success', (d) => {
        me = d.username;
        document.getElementById('authModal').style.display = 'none';
        updateCredits(d.balance);
    });
    socket.on('balance_update', (b) => updateCredits(b));
    function updateCredits(b) { document.getElementById('topCreditDisplay').innerText = `CREDITS: ${b}`; }

    // 2. STATE & UI
    socket.on('state_update', (s) => { state = s; renderUI(); });

    // 3. NEGOTIATION FLOW
    socket.on('prompt_proposal', () => {
        document.getElementById('propOverlay').style.display = 'block';
        document.getElementById('proposalModal').style.display = 'block';
    });
    
    function submitProposal() {
        const terms = {
            game: document.getElementById('setGame').value,
            targetScore: document.getElementById('setRounds').value,
            wager: document.getElementById('setWager').value
        };
        socket.emit('propose_terms', terms);
        document.getElementById('propOverlay').style.display = 'none';
        document.getElementById('proposalModal').style.display = 'none';
        document.getElementById('status').innerText = "WAITING FOR OPPONENT...";
    }

    socket.on('wait_for_proposal', () => { document.getElementById('status').innerText = "HOST IS PROPOSING TERMS..."; });

    socket.on('review_terms', (terms) => {
        document.getElementById('propOverlay').style.display = 'block';
        document.getElementById('acceptModal').style.display = 'block';
        document.getElementById('termDisplay').innerHTML = `GAME: ${terms.game.toUpperCase()}<br>ROUNDS: ${terms.targetScore}<br>WAGER: ${terms.wager}`;
    });

    function respond(accept) {
        socket.emit('respond_terms', accept);
        document.getElementById('propOverlay').style.display = 'none';
        document.getElementById('acceptModal').style.display = 'none';
    }

    socket.on('kicked_from_seat', () => { alert("You declined and left the seat."); });

    // 4. ANIMATIONS
    socket.on('anim_dice', (d) => {
        const h = `<div style="display:flex; gap:10px;">${getDie(d.roll[0])}${getDie(d.roll[1])}${getDie(d.roll[2])}</div>`;
        document.getElementById('visuals').innerHTML = h;
    });
    socket.on('anim_coin', (d) => {
        const h = `<div class="coin" style="transform: rotateY(720deg);">${d.result}</div>`;
        document.getElementById('visuals').innerHTML = h;
    });

    // 5. VOICE CHAT (WebRTC)
    socket.on('start_voice', async ({ initiator }) => {
        document.getElementById('voiceStatus').innerText = "CONNECTING VOICE...";
        
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        // Mute initially (Push to Talk)
        localStream.getAudioTracks()[0].enabled = false;
        
        peerConnection = new RTCPeerConnection(config);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.onicecandidate = event => {
            if (event.candidate) socket.emit('voice_signal', { candidate: event.candidate });
        };
        
        peerConnection.ontrack = event => {
            const remoteAudio = new Audio();
            remoteAudio.srcObject = event.streams[0];
            remoteAudio.play();
            document.getElementById('voiceStatus').innerText = "VOICE CONNECTED (HOLD SPACE)";
            document.getElementById('voiceStatus').style.color = "#2ecc71";
        };

        if (initiator) {
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('voice_signal', { sdp: offer });
        }
    });

    socket.on('voice_signal', async (data) => {
        if (!peerConnection) return;
        if (data.sdp) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
            if (data.sdp.type === 'offer') {
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                socket.emit('voice_signal', { sdp: answer });
            }
        } else if (data.candidate) {
            await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
    });

    // PUSH TO TALK
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && localStream) {
            if(!isTalking) {
                localStream.getAudioTracks()[0].enabled = true;
                isTalking = true;
                document.getElementById('voiceStatus').innerText = "MIC ACTIVE";
            }
        }
    });
    
    document.addEventListener('keyup', (e) => {
        if (e.code === 'Space' && localStream) {
            localStream.getAudioTracks()[0].enabled = false;
            isTalking = false;
            document.getElementById('voiceStatus').innerText = "VOICE CONNECTED (HOLD SPACE)";
        }
    });

    // HELPERS
    function reqSeat(n) { socket.emit('request_seat', n); }
    function act(action) { socket.emit('game_action', { action }); } // simplified for brevity
    function getDie(v) { return `<div class="die" v="${v}"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`; }
    
    function renderUI() {
        updateSeat(1); updateSeat(2);
        document.getElementById('p1Score').innerText = state.scores[1];
        document.getElementById('p2Score').innerText = state.scores[2];
        
        document.getElementById('p1Panel').classList.remove('active-turn');
        document.getElementById('p2Panel').classList.remove('active-turn');
        if(state.matchActive) document.getElementById(`p${state.turn}Panel`).classList.add('active-turn');
    }

    function updateSeat(n) {
        const p = state.seats[n];
        document.getElementById(`p${n}Name`).innerText = p || "EMPTY";
        const div = document.getElementById(`p${n}Controls`);
        
        if (p === me) {
            if (state.matchActive && state.turn === n) {
                // Simplified controls for Dice (expand for others)
                div.innerHTML = `<button class="btn btn-green" onclick="socket.emit('game_action', {})">PLAY</button>`;
            } else if (state.matchActive) {
                div.innerHTML = "LOCKED";
            } else {
                div.innerHTML = `<button class="btn btn-red" onclick="socket.emit('leave_seat')">LEAVE</button>`;
            }
        } else if (!p) {
            div.innerHTML = `<button class="btn" onclick="reqSeat(${n})">SIT</button>`;
        } else {
            div.innerHTML = "TAKEN";
        }
    }
</script>
</body>
</html>
