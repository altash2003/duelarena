<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CASINO DUEL ARENA</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --bg-dark: #0d0d10; 
            --bg-panel: #16161a; 
            --accent: #feca57; 
            --text: #fff; 
            --p1: #ff4757; 
            --p2: #2e86de; 
            --success: #2ecc71;
            --danger: #e74c3c;
        }
        
        * { box-sizing: border-box; }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text); 
            font-family: 'Press Start 2P', cursive; 
            margin: 0; height: 100vh; overflow: hidden; display: flex; 
            user-select: none;
            background-image: radial-gradient(circle at 50% 50%, #1a1a20 0%, #0d0d10 80%);
        }

        /* --- LAYOUT GRID --- */
        .main-wrapper { 
            display: flex; width: 100%; height: 100%; 
            padding: 20px; gap: 20px; margin-top: 30px; 
        }

        .game-section { 
            flex: 1; display: flex; flex-direction: column; 
            min-width: 0; /* Flexbox safety */
        }

        .arena { 
            display: grid; 
            /* 1. FIX: Fixed width sides, Giant Center */
            grid-template-columns: 280px 1fr 280px; 
            gap: 20px; 
            flex-grow: 1; 
            height: 100%;
        }

        .social-sidebar { 
            width: 320px; display: flex; flex-direction: column; gap: 15px; 
            flex-shrink: 0; border-left: 2px solid #222; padding-left: 15px;
        }

        /* --- COMPONENTS --- */

        /* 2. VISUAL HIERARCHY: Panels */
        .player-panel { 
            background: var(--bg-panel); 
            border: 2px solid #333; 
            border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; 
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; 
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        /* 8. ACTIVE TURN GLOW */
        .player-panel.active-turn { 
            border-color: #fff; 
            transform: translateY(-5px);
        }
        .p1-panel.active-turn { box-shadow: 0 0 30px rgba(255, 71, 87, 0.4); border-color: var(--p1); }
        .p2-panel.active-turn { box-shadow: 0 0 30px rgba(46, 134, 222, 0.4); border-color: var(--p2); }

        .center-stage { 
            background: #000; 
            border: 2px solid #333; 
            border-radius: 12px;
            display: flex; flex-direction: column; 
            position: relative; overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }

        /* 7. PLAYER IDENTITY */
        .avatar-placeholder {
            width: 80px; height: 80px;
            background: #222; border-radius: 50%;
            margin-top: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; color: #555;
            border: 3px solid #333;
        }
        .p-name { 
            margin-top: 10px; font-size: 12px; color: #aaa; 
            font-family: 'Rajdhani', sans-serif; font-weight: 700; text-transform: uppercase;
        }
        .p-score-badge {
            background: #000; padding: 5px 15px; border-radius: 20px;
            border: 1px solid #444; margin-top: 5px;
            font-family: 'Rajdhani', sans-serif; font-weight: 800; font-size: 24px;
        }
        .ready-status {
            font-size: 9px; margin-top: 5px; color: #444;
        }
        .ready-status.ready { color: var(--success); }

        /* 3. SIT BUTTONS (MAJOR UPGRADE) */
        .seat-btn { 
            margin-top: auto; margin-bottom: 20px;
            width: 80%; padding: 18px; 
            border: none; border-radius: 8px;
            font-family: 'Press Start 2P'; font-size: 10px; 
            cursor: pointer; transition: all 0.2s;
            text-transform: uppercase;
            box-shadow: 0 5px 0 rgba(0,0,0,0.5);
            position: relative; top: 0;
        }
        .seat-btn:active { top: 5px; box-shadow: 0 0 0 rgba(0,0,0,0); }
        
        .join-p1 { background: linear-gradient(135deg, #ff4757, #c0392b); color: #fff; }
        .join-p1:hover { box-shadow: 0 0 20px var(--p1); }
        
        .join-p2 { background: linear-gradient(135deg, #2e86de, #2980b9); color: #fff; }
        .join-p2:hover { box-shadow: 0 0 20px var(--p2); }

        .locked-btn { background: #333; color: #777; cursor: not-allowed; }
        .leave-btn { background: #333; border: 1px solid #555; color: #aaa; }
        .leave-btn:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

        /* 5. MATCH STATUS BAR */
        .status-container {
            position: absolute; top: 20px; width: 100%;
            display: flex; justify-content: center; z-index: 10;
        }
        .status-pill {
            background: #111; border: 2px solid #333;
            padding: 8px 20px; border-radius: 30px;
            font-size: 10px; color: #aaa;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
        .status-pill.open .status-dot { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .status-pill.closed .status-dot { background: var(--danger); }
        .status-pill.active .status-dot { background: var(--accent); animation: blink 1s infinite; }

        /* CENTER VISUALS */
        .visuals { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .vs-badge { font-size: 80px; font-family: 'Rajdhani'; font-weight: 900; color: #222; }

        /* 4. BETTING FLOW */
        .bet-panel { background: #1a1a1e; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .bet-header { font-size: 10px; color: #aaa; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px;}
        .bet-input-group { display: flex; gap: 5px; margin-bottom: 10px; }
        .input-dark { flex: 1; background: #000; border: 1px solid #444; color: #fff; padding: 10px; font-family: 'Rajdhani'; font-weight: bold; font-size: 14px; border-radius: 4px;}
        
        .side-selector { display: flex; gap: 5px; margin-bottom: 10px; }
        .side-btn { 
            flex: 1; padding: 10px; border: 1px solid #333; background: #111; color: #555; 
            cursor: pointer; border-radius: 4px; font-family: 'Press Start 2P'; font-size: 8px; transition: 0.2s; 
        }
        .side-btn.p1-sel:hover, .side-btn.p1-sel.active { background: var(--p1); color: #fff; border-color: var(--p1); }
        .side-btn.p2-sel:hover, .side-btn.p2-sel.active { background: var(--p2); color: #fff; border-color: var(--p2); }

        .confirm-bet { width: 100%; background: var(--success); color: #000; padding: 12px; border: none; border-radius: 4px; font-family: 'Press Start 2P'; font-size: 10px; cursor: pointer; }
        .confirm-bet:hover { filter: brightness(1.1); }
        
        .potential-win { font-size: 10px; color: #666; text-align: center; margin-top: 8px; }
        .potential-win span { color: var(--success); }

        /* 6. CHAT IMPROVEMENTS */
        .chat-box { flex: 1; background: #111; border: 1px solid #333; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
        .chat-log { 
            flex: 1; padding: 15px; overflow-y: auto; 
            font-family: 'Rajdhani', sans-serif; font-weight: 500; font-size: 15px; line-height: 1.4;
        }
        .chat-msg { margin-bottom: 6px; }
        .c-user { font-weight: 700; margin-right: 5px; font-size: 14px; }
        .c-text { color: #ddd; }
        .sys-msg { font-size: 11px; color: #555; font-style: italic; margin-bottom: 4px; } /* Collapsed look */

        /* Top Bar Credit */
        .credit-pill { 
            position: absolute; top: 20px; right: 20px; 
            background: #222; border: 1px solid #444; 
            padding: 8px 15px; border-radius: 20px; 
            font-size: 10px; color: var(--accent); display: flex; gap: 10px;
        }

        /* MODALS */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e1e24; border: 2px solid var(--accent); padding: 30px; z-index: 2000; text-align: center; box-shadow: 0 0 100px rgba(0,0,0,0.9); display: none; border-radius: 12px; }
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1500; display: none; backdrop-filter: blur(5px); }

        /* DICE ANIMATIONS */
        .dice-container { display: flex; gap: 15px; }
        .die { width: 60px; height: 60px; background: #fff; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; }
        .dot { background: #000; width: 12px; height: 12px; border-radius: 50%; margin: auto; visibility: hidden; }
        .die[v="1"] .dot:nth-child(5){visibility:visible} .die[v="2"] .dot:nth-child(1),.die[v="2"] .dot:nth-child(9){visibility:visible} .die[v="3"] .dot:nth-child(1),.die[v="3"] .dot:nth-child(5),.die[v="3"] .dot:nth-child(9){visibility:visible} .die[v="4"] .dot:nth-child(1),.die[v="4"] .dot:nth-child(3),.die[v="4"] .dot:nth-child(7),.die[v="4"] .dot:nth-child(9){visibility:visible} .die[v="5"] .dot:nth-child(1),.die[v="5"] .dot:nth-child(3),.die[v="5"] .dot:nth-child(5),.die[v="5"] .dot:nth-child(7),.die[v="5"] .dot:nth-child(9){visibility:visible} .die[v="6"] .dot:nth-child(1),.die[v="6"] .dot:nth-child(3),.die[v="6"] .dot:nth-child(4),.die[v="6"] .dot:nth-child(6),.die[v="6"] .dot:nth-child(7),.die[v="6"] .dot:nth-child(9){visibility:visible}
        @keyframes shake { 0% { transform: rotate(0deg); } 25% { transform: rotate(10deg); } 75% { transform: rotate(-10deg); } 100% { transform: rotate(0deg); } }
        .shaking { animation: shake 0.2s infinite; }

    </style>
</head>
<body>

    <div class="modal-overlay" id="overlay"></div>

    <div class="modal" id="authModal" style="display:block;">
        <h2 style="color:var(--accent); margin-top:0;">ENTER ARENA</h2>
        <input id="uInput" class="input-dark" placeholder="USERNAME" style="width:100%; margin-bottom:10px; font-family:'Press Start 2P'; font-size:10px;">
        <input id="pInput" type="password" class="input-dark" placeholder="PASSWORD" style="width:100%; margin-bottom:20px; font-family:'Press Start 2P'; font-size:10px;">
        <button class="confirm-bet" onclick="auth()">CONNECT</button>
    </div>

    <div class="modal" id="proposalModal">
        <h3>HOST SETTINGS</h3>
        <select id="setGame" class="input-dark" style="margin-bottom:10px; width:100%;"><option value="dice">DICE DUEL</option><option value="coin">COIN FLIP</option><option value="hl">HIGH-LOW</option><option value="roulette">ROULETTE</option><option value="rps">RPS</option><option value="ttt">TIC-TAC-TOE</option></select>
        <select id="setRounds" class="input-dark" style="margin-bottom:10px; width:100%;"><option value="1">SUDDEN DEATH (1)</option><option value="3">BEST OF 3</option><option value="5">RACE TO 5</option></select>
        <input id="setWager" type="number" class="input-dark" placeholder="WAGER" style="width:100%; margin-bottom:20px;">
        <button class="confirm-bet" onclick="submitProposal()">SEND CHALLENGE</button>
    </div>

    <div class="modal" id="acceptModal">
        <h3>NEW CHALLENGE</h3>
        <div id="termDisplay" style="color:#aaa; font-size:12px; margin-bottom:20px; font-family:'Rajdhani'"></div>
        <div style="display:flex; gap:10px;">
            <button class="confirm-bet" onclick="respond(true)">ACCEPT</button>
            <button class="confirm-bet" style="background:var(--danger); color:#fff;" onclick="respond(false)">DECLINE</button>
        </div>
    </div>

    <div class="credit-pill" id="creditDisplay">
        <i class="fas fa-coins"></i> <span id="walletVal">0</span> TC
    </div>

    <div class="main-wrapper">
        
        <div class="game-section">
            <div class="arena">
                
                <div class="player-panel p1-panel" id="p1Panel">
                    <div class="avatar-placeholder" id="p1Avatar"><i class="fas fa-user"></i></div>
                    <div class="p-name" id="p1Name">EMPTY SEAT</div>
                    <div class="p-score-badge" id="p1Score">0</div>
                    <div class="ready-status" id="p1Status">WAITING...</div>
                    
                    <div id="p1Controls" style="width:100%; margin-top:auto;">
                        <button class="seat-btn join-p1" onclick="reqSeat(1)">JOIN AS P1</button>
                    </div>
                </div>

                <div class="center-stage">
                    <div class="status-container">
                        <div class="status-pill open" id="statusBar">
                            <div class="status-dot"></div> <span id="statusText">WAITING FOR PLAYERS</span>
                        </div>
                    </div>

                    <div class="visuals" id="visuals">
                        <div class="vs-badge">VS</div>
                    </div>
                </div>

                <div class="player-panel p2-panel" id="p2Panel">
                    <div class="avatar-placeholder" id="p2Avatar"><i class="fas fa-user"></i></div>
                    <div class="p-name" id="p2Name">EMPTY SEAT</div>
                    <div class="p-score-badge" id="p2Score">0</div>
                    <div class="ready-status" id="p2Status">WAITING...</div>

                    <div id="p2Controls" style="width:100%; margin-top:auto;">
                        <button class="seat-btn join-p2" onclick="reqSeat(2)">JOIN AS P2</button>
                    </div>
                </div>

            </div>
        </div>

        <div class="social-sidebar">
            
            <div class="bet-panel">
                <div class="bet-header">SPECTATOR BET</div>
                <div class="bet-input-group">
                    <input type="number" id="betAmt" class="input-dark" placeholder="AMOUNT" oninput="calcWin()">
                </div>
                <div class="side-selector">
                    <div class="side-btn p1-sel" id="btnBetP1" onclick="selBet(1)">P1</div>
                    <div class="side-btn p2-sel" id="btnBetP2" onclick="selBet(2)">P2</div>
                </div>
                <div class="potential-win">POTENTIAL WIN: <span id="potWin">0</span> TC</div>
                <button class="confirm-bet" id="placeBetBtn" onclick="placeBet()" disabled style="opacity:0.5; margin-top:10px;">PLACE BET</button>
            </div>

            <div class="chat-box">
                <div class="bet-header" style="padding:10px; background:#1a1a1e; margin:0;">LIVE CHAT</div>
                <div class="chat-log custom-scroll" id="chatLog">
                    </div>
                <input class="input-dark" style="border:none; border-top:1px solid #333;" placeholder="Type message..." onkeypress="sendChat(event)">
            </div>

        </div>
    </div>

<script>
    // --- CLIENT LOGIC ---
    // (This connects to the server logic provided in the previous step)
    
    // Security
    document.addEventListener('contextmenu', e => e.preventDefault());

    const socket = io();
    let me = null;
    let selectedSide = null;
    let state = {};

    // Auth
    function auth() {
        const u = document.getElementById('uInput').value;
        const p = document.getElementById('pInput').value;
        if(u && p) socket.emit('auth', { username: u, password: p });
    }
    socket.on('auth_success', (d) => {
        me = d.username;
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('authModal').style.display = 'none';
        updateWallet(d.balance);
    });
    
    // Wallet
    socket.on('balance_update', (b) => updateWallet(b));
    function updateWallet(b) { document.getElementById('walletVal').innerText = b; }

    // Betting Flow
    function selBet(side) {
        selectedSide = side;
        document.getElementById('btnBetP1').classList.toggle('active', side===1);
        document.getElementById('btnBetP2').classList.toggle('active', side===2);
        calcWin();
    }
    function calcWin() {
        const amt = parseInt(document.getElementById('betAmt').value) || 0;
        document.getElementById('potWin').innerText = (amt * 2);
        const btn = document.getElementById('placeBetBtn');
        if(amt > 0 && selectedSide) {
            btn.disabled = false; btn.style.opacity = 1;
        } else {
            btn.disabled = true; btn.style.opacity = 0.5;
        }
    }
    function placeBet() {
        const amt = parseInt(document.getElementById('betAmt').value);
        if(amt > 0 && selectedSide) {
            socket.emit('place_bet', { amount: amt, target: selectedSide });
            // Reset UI
            document.getElementById('betAmt').value = '';
            calcWin();
        }
    }

    // Chat
    function sendChat(e) { if(e.key==='Enter' && e.target.value) { socket.emit('chat_msg', e.target.value); e.target.value=''; } }
    socket.on('chat_msg', (d) => {
        const log = document.getElementById('chatLog');
        const isSys = d.user === 'SYSTEM' || d.user === 'REF';
        let html = '';
        if(isSys) {
            html = `<div class="sys-msg">${d.text}</div>`;
            updateStatus(d.text, 'active');
        } else {
            // Colored names based on hash roughly
            const color = d.user === me ? '#feca57' : '#ccc';
            html = `<div class="chat-msg"><span class="c-user" style="color:${color}">${d.user}:</span><span class="c-text">${d.text}</span></div>`;
        }
        log.innerHTML += html;
        log.scrollTop = log.scrollHeight;
    });

    // Main State Update
    socket.on('state_update', (s) => {
        state = s;
        renderSeats(1); renderSeats(2);
        
        // Scores
        document.getElementById('p1Score').innerText = s.scores[1];
        document.getElementById('p2Score').innerText = s.scores[2];
        
        // Active Turn Highlight
        document.getElementById('p1Panel').classList.remove('active-turn');
        document.getElementById('p2Panel').classList.remove('active-turn');
        if(s.matchActive && s.settings.game !== 'rps') {
            document.getElementById(`p${s.turn}Panel`).classList.add('active-turn');
        }

        // Betting Lock Status
        const bar = document.getElementById('statusBar');
        if(s.bettingLocked) {
            bar.className = 'status-pill closed';
            document.querySelector('.status-dot').style.background = 'var(--danger)';
            document.getElementById('statusText').innerText = "BETS CLOSED";
            document.getElementById('betAmt').disabled = true;
        } else if (s.matchActive) {
            bar.className = 'status-pill open';
            document.getElementById('statusText').innerText = "BETS OPEN";
            document.getElementById('betAmt').disabled = false;
        }
    });

    function renderSeats(n) {
        const user = state.seats[n];
        const nameEl = document.getElementById(`p${n}Name`);
        const avEl = document.getElementById(`p${n}Avatar`);
        const statEl = document.getElementById(`p${n}Status`);
        const ctrlEl = document.getElementById(`p${n}Controls`);

        if(user) {
            nameEl.innerText = user;
            nameEl.style.color = '#fff';
            avEl.innerHTML = `<i class="fas fa-user-astronaut"></i>`; // Filled Avatar
            avEl.style.color = '#fff'; avEl.style.borderColor = n===1 ? 'var(--p1)' : 'var(--p2)';
            statEl.innerText = "READY"; statEl.classList.add('ready');

            if(user === me) {
                // My Controls
                if(state.matchActive) {
                    if(state.turn === n || state.settings.game === 'rps') {
                        // Action Buttons based on Game
                        const G = state.settings.game;
                        let h = '';
                        if(G=='dice') h=`<button class="seat-btn join-p${n}" onclick="act('roll')">ROLL DICE</button>`;
                        if(G=='coin') h=`<button class="seat-btn join-p${n}" onclick="actC('H')">HEADS</button><button class="seat-btn join-p${n}" onclick="actC('T')">TAILS</button>`;
                        if(G=='hl') h=`<button class="seat-btn join-p${n}" onclick="actC('high')">HIGHER</button><button class="seat-btn join-p${n}" onclick="actC('low')">LOWER</button>`;
                        // ... add others
                        ctrlEl.innerHTML = h;
                    } else {
                        ctrlEl.innerHTML = `<button class="seat-btn locked-btn">OPPONENT TURN</button>`;
                    }
                } else {
                    ctrlEl.innerHTML = `<button class="seat-btn leave-btn" onclick="socket.emit('leave_seat')">LEAVE SEAT</button>`;
                }
            } else {
                ctrlEl.innerHTML = `<div style="text-align:center; font-size:10px; color:#555; margin-bottom:20px;">OPPONENT</div>`;
            }
        } else {
            // Empty Seat
            nameEl.innerText = "EMPTY SEAT";
            nameEl.style.color = "#555";
            avEl.innerHTML = `<i class="fas fa-user"></i>`;
            avEl.style.color = "#333"; avEl.style.borderColor = "#333";
            statEl.innerText = "WAITING..."; statEl.classList.remove('ready');
            ctrlEl.innerHTML = `<button class="seat-btn join-p${n}" onclick="reqSeat(${n})">JOIN AS P${n}</button>`;
        }
    }

    // Helper functions
    function updateStatus(txt, type) {
        document.getElementById('statusText').innerText = txt;
        const bar = document.getElementById('statusBar');
        bar.className = `status-pill ${type}`;
    }
    
    function reqSeat(n) { socket.emit('request_seat', n); }
    function act(action) { socket.emit('game_action', { action }); }
    function actC(guess) { socket.emit('game_action', { guess }); }

    // Visuals (Dice, Coin etc - kept from previous logic)
    socket.on('anim_dice', (d) => {
         document.getElementById('visuals').innerHTML = `
            <div class="dice-container">
                ${getDie(d.roll[0], true)}${getDie(d.roll[1], true)}${getDie(d.roll[2], true)}
            </div>
         `;
    });
    function getDie(v, anim) { 
        return `<div class="die ${anim?'shaking':''}" v="${v}"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`; 
    }

    // Modal Logic (Prop/Accept)
    socket.on('prompt_proposal', () => { showModal('proposalModal'); });
    socket.on('review_terms', (t) => {
        document.getElementById('termDisplay').innerHTML = `GAME: ${t.game.toUpperCase()} <br> ROUNDS: ${t.targetScore} <br> WAGER: ${t.wager}`;
        showModal('acceptModal');
    });
    function showModal(id) {
        document.getElementById('overlay').style.display='block';
        document.getElementById(id).style.display='block';
    }
    function submitProposal() {
        socket.emit('propose_terms', {
            game: document.getElementById('setGame').value,
            targetScore: document.getElementById('setRounds').value,
            wager: document.getElementById('setWager').value
        });
        closeModals();
        updateStatus("WAITING FOR OPPONENT...", "active");
    }
    function respond(ok) {
        socket.emit('respond_terms', ok);
        closeModals();
    }
    function closeModals() {
        document.getElementById('overlay').style.display='none';
        document.querySelectorAll('.modal').forEach(m => m.style.display='none');
    }

</script>
