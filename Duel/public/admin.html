<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Duel Arena</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; padding: 20px; }
        h1 { border-bottom: 1px solid #0f0; padding-bottom: 10px; }
        .data-box { width: 100%; height: 500px; background: #000; border: 1px solid #333; color: #ccc; padding: 10px; font-family: monospace; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #fff; }
    </style>
</head>
<body>

    <h1>ADMIN CONTROL PANEL</h1>
    <p>Below is the raw User Data (Plain Text JSON).</p>

    <textarea id="dataView" class="data-box" readonly>Loading...</textarea>
    
    <br>
    <button onclick="refreshData()">REFRESH DATA</button>
    <button onclick="window.location.href='/'">GO TO GAME</button>

    <script>
        function refreshData() {
            fetch('/api/admin/data')
                .then(res => res.json())
                .then(data => {
                    // Pretty print the JSON
                    document.getElementById('dataView').value = JSON.stringify(data, null, 4);
                })
                .catch(err => {
                    document.getElementById('dataView').value = "Error loading data.";
                });
        }

        // Load on start
        refreshData();
        
        // Auto refresh every 5 seconds
        setInterval(refreshData, 5000);
    </script>

</body>
</html>
